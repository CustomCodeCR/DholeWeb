server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JWTs with many authorized scopes can exceed nginx's default 8 KB header-line
    # limit. The original 400 Request Header Or Cookie Too Large was generated
    # before /api/crm/hacienda/lookup reached the Gateway or CRM.
    # These are request-header buffers, not body size limits. Bounded allocation
    # occurs only when headers need more space. Keep JWT validation unchanged.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Transport/security headers are emitted by the SPA origin. Cloudflare forwards
    # them to the browser even though the tunnel reaches this container over HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Authorized noVNC is served from the Agent API on the separate API origin.
    # Limit framing to the trusted API origins; do not permit arbitrary external sites.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' blob: https://api.logisticacastrofallas.com https://dhole-api.customcodecr.com; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.logisticacastrofallas.com wss://api.logisticacastrofallas.com https://dhole-api.customcodecr.com wss://dhole-api.customcodecr.com https://nominatim.openstreetmap.org https://api.geoapify.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;


    # Authenticated Hacienda GET/POST stays on the Web origin; POST hides tax IDs from URLs.
    # Runtime Docker DNS avoids failing the SPA startup when Gateway is restarting.
    location ~ ^/api/(crm|config/srm)/hacienda/lookup$ {
        access_log off;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dhole_hacienda_gateway "http://api-gateway:8080";
        proxy_pass $dhole_hacienda_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "api-gateway:8080";
        proxy_set_header Authorization $http_authorization;
        # Browser cookies are not Gateway credentials and can exceed header limits.
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_intercept_errors off;
        limit_except GET POST { deny all; }
    }

    # Same-origin Gateway route: bearer JWT remains end-to-end, without browser CORS preflight.
    # The more specific Hacienda regex location above preserves its existing restrictions.
    # Docker DNS resolution is dynamic so nginx starts while the Gateway is restarting.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dhole_gateway "http://api-gateway:8080";
        proxy_pass $dhole_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "api-gateway:8080";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 512m;
        proxy_intercept_errors off;
    }

    # Same-origin Operations SignalR; forward the authorized WebSocket upgrade.
    location = /hubs/operations {
        access_log off;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dhole_operations_gateway "http://api-gateway:8080";
        proxy_pass $dhole_operations_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "api-gateway:8080";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Never keep the SPA entrypoint stale after a deployment. `expires` is used
    # instead of location-level add_header so all security headers above are inherited.
    # Only this inert bootstrap may execute inline JavaScript. Untrusted reports
    # run in an iframe with sandbox=allow-scripts (no allow-same-origin).
    # The SPA retains its restrictive script-src 'self' CSP.
    location = /competitor-analysis-viewer.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # The version probe must never fall back to index.html or a stale cached build.
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints production assets, so they can be cached safely.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
