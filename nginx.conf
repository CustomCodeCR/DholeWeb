server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Transport/security headers are emitted by the SPA origin. Cloudflare forwards
    # them to the browser even though the tunnel reaches this container over HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Authorized noVNC is served from the Agent API on the separate API origin.
    # Limit framing to the trusted API origins; do not permit arbitrary external sites.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' blob: https://api.logisticacastrofallas.com https://dhole-api.customcodecr.com; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.logisticacastrofallas.com wss://api.logisticacastrofallas.com https://dhole-api.customcodecr.com wss://dhole-api.customcodecr.com https://nominatim.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Never keep the SPA entrypoint stale after a deployment. `expires` is used
    # instead of location-level add_header so all security headers above are inherited.
    # Only this inert bootstrap may execute inline JavaScript. Untrusted reports
    # run in an iframe with sandbox=allow-scripts (no allow-same-origin).
    # The SPA retains its restrictive script-src 'self' CSP.
    location = /competitor-analysis-viewer.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints production assets, so they can be cached safely.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
