server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Transport/security headers are emitted by the SPA origin. Cloudflare forwards
    # them to the browser even though the tunnel reaches this container over HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://dhole-api.customcodecr.com wss://dhole-api.customcodecr.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Never keep the SPA entrypoint stale after a deployment. `expires` is used
    # instead of location-level add_header so all security headers above are inherited.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints production assets, so they can be cached safely.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
