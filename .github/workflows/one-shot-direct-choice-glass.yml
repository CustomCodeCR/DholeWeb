name: Apply direct choice glass flow

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-direct-choice-glass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make selection cards advance and strengthen glass
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply-web-fix.py
          python /tmp/apply-web-fix.py

      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-direct-choice-glass.yml
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --check
          git commit -m 'fix(pricing): advance selection cards and strengthen glass'
          git push origin master
