name: Show cost comments on pricing screen 7

on:
  push:
    paths:
      - '.github/workflows/show-cost-comments-screen7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cost comment support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''  costId?: string | null
            contextLabel?: string | null
            currencyId: string
          ''',
          '''  costId?: string | null
            contextLabel?: string | null
            notes?: string | null
            currencyId: string
          ''',
          'RateLine notes field',
          )

          replace_once(
          '''      costId: cost.id,
                contextLabel: costContextLabel(cost),
                currencyId: cost.currencyId,
          ''',
          '''      costId: cost.id,
                contextLabel: costContextLabel(cost),
                notes: cost.notes?.trim() || null,
                currencyId: cost.currencyId,
          ''',
          'configured cost notes mapping',
          )

          replace_once(
          '''    notes: line.costDetailType === 'Insurance'
                ? cargoInsuranceNote(form.cargoValue, form.freightCost)
                : line.manual
                  ? 'Cargo manual agregado desde el wizard de Pricing.'
                  : null,
          ''',
          '''    notes: line.costDetailType === 'Insurance'
                ? [line.notes, cargoInsuranceNote(form.cargoValue, form.freightCost)].filter(Boolean).join(' · ')
                : line.manual
                  ? line.notes || 'Cargo manual agregado desde el wizard de Pricing.'
                  : line.notes || null,
          ''',
          'persist cost notes on rate detail',
          )

          standard_anchor = '''                <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
                      </div>
                      <DhInput v-model.number="line.costAmount"'''
          standard_replacement = '''                <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
                        <div v-if="line.notes" class="mt-2 rounded-xl border border-[var(--dh-border)] bg-[var(--dh-surface)] px-3 py-2 text-left">
                          <span class="block text-[10px] font-black uppercase tracking-[0.12em] text-[var(--dh-text-muted)]">Comentario de Costos y recargos</span>
                          <p class="mt-1 whitespace-pre-wrap break-words text-xs font-semibold leading-relaxed text-[var(--dh-text-soft)]">{{ line.notes }}</p>
                        </div>
                      </div>
                      <DhInput v-model.number="line.costAmount"'''
          replace_once(standard_anchor, standard_replacement, 'standard line comment UI')

          optional_anchor = '''                  <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                            {{ sectionLabel(line.section) }} · Rubro: {{ detailTypeLabel(line.costDetailType) }} · {{ chargeBasisLabel(line.chargeBasis) }}
                          </p>
                        </div>
                        <DhInput v-model.number="line.costAmount"'''
          optional_replacement = '''                  <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                            {{ sectionLabel(line.section) }} · Rubro: {{ detailTypeLabel(line.costDetailType) }} · {{ chargeBasisLabel(line.chargeBasis) }}
                          </p>
                          <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
                          <div v-if="line.notes" class="mt-2 rounded-xl border border-[var(--dh-border)] bg-[var(--dh-surface)] px-3 py-2 text-left">
                            <span class="block text-[10px] font-black uppercase tracking-[0.12em] text-[var(--dh-text-muted)]">Comentario de Costos y recargos</span>
                            <p class="mt-1 whitespace-pre-wrap break-words text-xs font-semibold leading-relaxed text-[var(--dh-text-soft)]">{{ line.notes }}</p>
                          </div>
                        </div>
                        <DhInput v-model.number="line.costAmount"'''
          replace_once(optional_anchor, optional_replacement, 'optional line comment UI')

          path.write_text(text, encoding='utf-8')
          PY

          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

          rm -f .github/workflows/show-cost-comments-screen7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): show cost comments in rate lines"
          git push origin HEAD:master
