name: Dhole CRM Phase 7 UI validation
on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/modules/crm/**'
      - 'src/core/router/index.ts'
      - 'src/core/composables/useSidebarItems.ts'
      - 'src/core/i18n/index.ts'
      - 'tests/crmFrontend.test.ts'
      - 'tests/crmAgenda.test.ts'
      - '.github/workflows/ci-crm-phase7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crm-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify CRM route/permission and API regression contracts
        run: pnpm run test:crm
      - name: Strict Vue TypeScript checking
        run: pnpm run type-check
      - name: Build real Vue 3 application
        run: pnpm run build-only
      - name: Audit production dependency vulnerabilities (high+)
        run: pnpm audit --prod --audit-level high
