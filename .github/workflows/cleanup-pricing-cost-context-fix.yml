name: Cleanup pricing Cost context fix

on:
  push:
    paths:
      - '.github/workflows/cleanup-pricing-cost-context-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup types and formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wizard = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = wizard.read_text(encoding='utf-8')

          text = text.replace(
              '  BrowseImportRatesQuery,\n',
              '  BrowseCostsQuery,\n  BrowseImportRatesQuery,\n',
              1,
          )
          text = text.replace('  buildOperationalLines,\n', '', 1)
          text = text.replace('  canonicalServiceLine,\n', '', 1)

          service_start = 'function serviceAmounts(service: CatalogItemSelectDto) {'
          loader_start = 'async function loadApplicableCosts() {'
          if service_start in text:
              start = text.index(service_start)
              end = text.index(loader_start, start)
              text = text[:start] + text[end:]

          old_loader = '''async function loadApplicableCosts() {
            try {
              costs.value = await PricingService.selectCosts({
                carrierId: form.carrierId || undefined,
                agentId: form.agentId || undefined,
                polId: form.originId || undefined,
                poeId: form.destinationId || undefined,
                podId: form.podId || undefined,
                incotermId: form.incotermId || undefined,
                shipmentMode: shipmentModeForApi.value,
                isActive: true,
                applicableToContext: true,
              } as any)
            } catch (error) {
              costs.value = []
              toastStore.backendError(
                error,
                'No se pudieron cargar los costos que coinciden con Naviera, Agente, POL, POE, POD e Incoterm.',
              )
            }
          }
'''
          new_loader = '''async function loadApplicableCosts() {
            const query: BrowseCostsQuery = {
              carrierId: form.carrierId || undefined,
              agentId: form.agentId || undefined,
              polId: form.originId || undefined,
              poeId: form.destinationId || undefined,
              podId: form.podId || undefined,
              incotermId: form.incotermId || undefined,
              shipmentMode: shipmentModeForApi.value,
              isActive: true,
              applicableToContext: true,
            }

            try {
              costs.value = await PricingService.selectCosts(query)
            } catch (error) {
              costs.value = []
              toastStore.backendError(
                error,
                'No se pudieron cargar los costos que coinciden con Naviera, Agente, POL, POE, POD e Incoterm.',
              )
            }
          }
'''
          assert old_loader in text, 'loadApplicableCosts block changed unexpectedly'
          text = text.replace(old_loader, new_loader, 1)

          old_next = '''  if (step.value === 6) {
          await loadApplicableCosts()
          rebuildRateLines()
        }
'''
          new_next = '''  if (step.value === 6) {
            await loadApplicableCosts()
            rebuildRateLines()
          }
'''
          assert old_next in text, 'step 6 indentation block changed unexpectedly'
          text = text.replace(old_next, new_next, 1)

          wizard.write_text(text, encoding='utf-8')

          pricing = Path('src/core/interfaces/pricing.ts')
          ptext = pricing.read_text(encoding='utf-8')
          old_query = '''export interface BrowseCostsQuery extends Record<string, unknown> {
            pageNumber?: number
            pageSize?: number
            search?: string | null
            costType?: CostType | null
            costDetailType?: CostDetailType | null
            carrierId?: string | null
            agentId?: string | null
            portId?: string | null
            portRole?: CostPortRole | null
            currencyId?: string | null
            isActive?: boolean | null
          }
'''
          new_query = '''export interface BrowseCostsQuery extends Record<string, unknown> {
            pageNumber?: number
            pageSize?: number
            search?: string | null
            costType?: CostType | null
            costDetailType?: CostDetailType | null
            carrierId?: string | null
            agentId?: string | null
            portId?: string | null
            portRole?: CostPortRole | null
            polId?: string | null
            poeId?: string | null
            podId?: string | null
            incotermId?: string | null
            shipmentMode?: ShipmentMode | null
            applicableToContext?: boolean | null
            currencyId?: string | null
            isActive?: boolean | null
          }
'''
          # Dedent the literal indentation introduced by YAML/Python nesting.
          import textwrap
          old_query = textwrap.dedent(old_query)
          new_query = textwrap.dedent(new_query)
          assert old_query in ptext, 'BrowseCostsQuery block changed unexpectedly'
          ptext = ptext.replace(old_query, new_query, 1)
          pricing.write_text(ptext, encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-pricing-cost-context-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(pricing): type Cost context query"
          git push
