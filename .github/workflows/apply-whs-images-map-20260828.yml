name: Apply WHS image and map fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-whs-images-map-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_whs_images_map_20260828.py

      - name: Validate build
        run: docker build --target build -t dhole-web-whs-image-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-whs-images-map-20260828.yml
          rm -f .github/scripts/patch_whs_images_map_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): focus FCA WHS and show warehouse images'
          git push origin master
