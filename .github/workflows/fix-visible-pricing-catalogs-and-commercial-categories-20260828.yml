name: Fix visible pricing catalogs and commercial categories

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-visible-pricing-catalogs-and-commercial-categories-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Web corrections
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/dhole-web-pricing-patch.py
          python3 /tmp/dhole-web-pricing-patch.py
          git diff --check

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          docker build --target build -t dhole-web-pricing-commercial-validation .

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-visible-pricing-catalogs-and-commercial-categories-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing-web): expose catalogs and five commercial categories"
          git push origin HEAD:master
