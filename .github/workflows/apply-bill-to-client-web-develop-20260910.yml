name: Apply billing client frontend develop

on:
  push:
    branches: [codex/bill-to-client-web-develop-20260910]
    paths:
      - '.github/workflows/apply-bill-to-client-web-develop-20260910.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply frontend patch
        run: python .github/scripts/patch_bill_to_client_20260910.py

      - name: Validate frontend build
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build -f Dockerfile \
            --build-arg VITE_API_URL="https://dhole-api.customcodecr.com" \
            --build-arg VITE_APP_NAME="DholeSystem" \
            --build-arg VITE_FRONTEND_DOMAIN="dhole.customcodecr.com" \
            -t dhole/web-bill-to-client-develop-validation . 2>&1 | tee /tmp/bill-to-client-web-build.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bill-to-client-web-develop-log
          path: /tmp/bill-to-client-web-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop on failed build
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bill-to-client-web-develop-20260910.yml
          rm -f .github/scripts/patch_bill_to_client_20260910.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pricing): assign billing client by item and block'
          git push origin codex/bill-to-client-web-develop-20260910
