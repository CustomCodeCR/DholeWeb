name: One-off clean insurance parity

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-clean-insurance-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Remove obsolete insurance UI overrides
        shell: python
        run: |
          from pathlib import Path

          path = Path('build/pricingWizardUiParity.ts')
          text = path.read_text()

          def cut_between(source: str, start_marker: str, end_marker: str) -> str:
            start = source.find(start_marker)
            if start < 0:
              raise SystemExit(f'start marker not found: {start_marker}')
            end = source.find(end_marker, start)
            if end < 0:
              raise SystemExit(f'end marker not found: {end_marker}')
            return source[:start] + source[end:]

          # Do not inject the removed Incoterm/insurance panel anymore.
          text = cut_between(
            text,
            '      const importAnchor =',
            '      const stateAnchor =',
          )

          # Keep the established insurance business formula override, but remove
          # the obsolete cargoInsuranceEnabled state that depended on the deleted UI toggle.
          logic_start = text.find('      const sharedInsuranceLogic =')
          logic_end = text.find('      code = replaceOne(', logic_start)
          if logic_start < 0 or logic_end < 0:
            raise SystemExit('shared insurance logic markers not found')
          new_logic = '''      const sharedInsuranceLogic = `function calculateCargoInsurance(cargoValue: number, _freightAmount: number) {\\n  const value = Math.max(0, Number(cargoValue) || 0)\\n  const roundMoney = (amount: number) => Math.round((amount + Number.EPSILON) * 100) / 100\\n  return {\\n    insuredValue: roundMoney(value),\\n    cost: Math.max(35, roundMoney(value * 0.002)),\\n    sale: Math.max(95, roundMoney(value * 0.0065)),\\n  }\\n}\\n\\nfunction cargoInsuranceNote(cargoValue: number, freightAmount: number) {\\n  const calculated = calculateCargoInsurance(cargoValue, freightAmount)\\n  return \\`Seguro de carga · valor carga USD \\${calculated.insuredValue.toFixed(2)} · venta 0.65% · mínimo USD 95 · costo 0.20% · mínimo costo USD 35\\`\\n}`
'''
          text = text[:logic_start] + new_logic + text[logic_end:]

          # The source wizard now owns insurance activation/reactivity. Remove every
          # build-time override that required the deleted Apply-policy toggle, hid
          # cargo value, or rewrote the insurance line activation.
          text = cut_between(
            text,
            '      const effectiveServicesAnchor =',
            '      const hydrationAnchor =',
          )

          hydration_start = text.find('      const hydrationReplacement =')
          hydration_end = text.find('\n      code = replaceOne(code, hydrationAnchor', hydration_start)
          if hydration_start < 0 or hydration_end < 0:
            raise SystemExit('hydration markers not found')
          hydration = '''      const hydrationReplacement = `${hydrationAnchor}\\n    const persistedInsurance = rate.rateDetails.find((detail) => detail.costDetailType === 'Insurance')\\n    if (persistedInsurance) {\\n      const cargoValueMatch = String(persistedInsurance.notes ?? '').match(/valor (?:carga|FOB) USD\\\\s+([0-9]+(?:\\\\.[0-9]+)?)/i)\\n      if (cargoValueMatch?.[1]) form.cargoValue = Number(cargoValueMatch[1])\\n    }`'''
          text = text[:hydration_start] + hydration + text[hydration_end:]

          reset_start = text.find('      const resetReplacement =')
          reset_end = text.find('\n      code = replaceOne(code, resetAnchor', reset_start)
          if reset_start < 0 or reset_end < 0:
            raise SystemExit('reset markers not found')
          reset = '''      const resetReplacement = `  draftCommercialTerms.value = { includes: [], subjectTo: [], excludes: [] }\\n  draftCommercialTermsInitialized.value = false\\n  form.cargoValue = 0\\n  supportEntityId.value = crypto.randomUUID()`'''
          text = text[:reset_start] + reset + text[reset_end:]

          # Source watcher now rebuilds the Insurance line from serviceIds/cargoValue.
          text = cut_between(
            text,
            '      const stepWatcherAnchor =',
            '      const termsSectionAnchor =',
          )

          if 'cargoInsuranceEnabled' in text:
            raise SystemExit('obsolete cargoInsuranceEnabled reference remains in parity plugin')

          path.write_text(text)

      - name: Commit parity fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-clean-insurance-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/pricingWizardUiParity.ts .github/workflows/oneoff-clean-insurance-parity.yml
          git commit -m 'fix(web): stop build from overriding cargo insurance activation'
          git push origin develop
