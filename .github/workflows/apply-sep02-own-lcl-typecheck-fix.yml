name: Apply Sep 02 own LCL typecheck fix

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-sep02-own-lcl-typecheck-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python .github/scripts/fix_sep02_own_lcl_click.py
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run type-check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-sep02-own-lcl-typecheck-fix.yml
          rm -f .github/scripts/fix_sep02_own_lcl_click.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web): correct own LCL scenario click binding'
          git push origin develop
