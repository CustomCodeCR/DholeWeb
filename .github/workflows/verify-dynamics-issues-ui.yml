name: Verify Dynamics issues UI (temporary)
on:
  push:
    branches: [fix/dynamics-sync-status-ui-20261021]
permissions:
  contents: read
jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build Dynamics issues UI
        run: pnpm run build
