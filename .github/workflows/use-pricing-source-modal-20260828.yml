name: Apply Pricing source modal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/use-pricing-source-modal-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace popup with modal
        run: python3 .github/scripts/use_pricing_source_modal_20260828.py

      - name: Validate production build
        run: docker build --target build -t dhole-web-source-modal-validation .

      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/use-pricing-source-modal-20260828.yml
          rm -f .github/scripts/use_pricing_source_modal_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): open tariff source in modal'
          git push origin HEAD:master
