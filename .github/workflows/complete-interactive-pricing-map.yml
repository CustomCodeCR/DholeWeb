name: Complete interactive pricing map and mobile UX

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/complete-interactive-pricing-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply interactive map, sticky totals and mobile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # <script setup> cannot expose a normal ES-module export.
          map_path = Path('src/modules/pricing/components/PricingInteractiveOsmMap.vue')
          map_text = map_path.read_text(encoding='utf-8-sig')
          map_text = replace_once(
              map_text,
              'export interface PricingMapMarker {',
              'interface PricingMapMarker {',
              'map marker interface export',
          )
          map_path.write_text(map_text, encoding='utf-8')

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8-sig')

          text = replace_once(
              text,
              '  Search,\n  Ship,\n  Truck,',
              '  Search,\n  Ship,\n  Sparkles,\n  Truck,',
              'Sparkles icon import',
          )
          text = replace_once(
              text,
              "import PricingCrystalMultiSelect from '@/modules/pricing/components/PricingCrystalMultiSelect.vue'\n",
              "import PricingCrystalMultiSelect from '@/modules/pricing/components/PricingCrystalMultiSelect.vue'\nimport PricingInteractiveOsmMap from '@/modules/pricing/components/PricingInteractiveOsmMap.vue'\n",
              'interactive map import',
          )

          old_location_computed = '''const collectionMapUrl = computed(() => {
            const coordinates = pickupCoordinates.value
            if (!coordinates) {
              return 'https://www.openstreetmap.org/export/embed.html?bbox=-180%2C-75%2C180%2C75&layer=mapnik'
            }
            const span = 0.08
            const left = coordinates.longitude - span
            const right = coordinates.longitude + span
            const bottom = coordinates.latitude - span
            const top = coordinates.latitude + span
            return `https://www.openstreetmap.org/export/embed.html?bbox=${left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik&marker=${coordinates.latitude}%2C${coordinates.longitude}`
          })
          const exwLocationReady = computed(() => selectedIncotermCode.value !== 'EXW' || Boolean(form.pickupAddress.trim()))
          const fcaLocationReady = computed(() =>
            selectedIncotermCode.value !== 'FCA' || Boolean(form.warehouseId || form.pickupAddress.trim()),
          )'''.replace('          ', '')

          new_location_computed = '''const warehouseMapMarkers = computed(() =>
            catalogs.warehouses.flatMap((warehouse) => {
              let latitude = metadataNumber(warehouse, 'latitude', 'lat')
              let longitude = metadataNumber(warehouse, 'longitude', 'lng')

              // A selected WHS may have been geocoded from its configured address even if
              // its metadata did not originally contain coordinates.
              if (warehouse.id === form.warehouseId) {
                latitude ??= form.pickupLatitude
                longitude ??= form.pickupLongitude
              }

              if (latitude == null || longitude == null) return []
              return [{
                id: warehouse.id,
                label: warehouse.label || displayValue(warehouse) || warehouse.code,
                latitude,
                longitude,
                selected: warehouse.id === form.warehouseId,
              }]
            }),
          )
          const exwLocationReady = computed(() =>
            selectedIncotermCode.value !== 'EXW' ||
            Boolean(form.pickupAddress.trim() && pickupCoordinates.value),
          )
          const fcaLocationReady = computed(() =>
            selectedIncotermCode.value !== 'FCA' ||
            (catalogs.warehouses.length
              ? Boolean(form.warehouseId)
              : Boolean(form.pickupAddress.trim() && pickupCoordinates.value)),
          )'''.replace('          ', '')
          text = replace_once(text, old_location_computed, new_location_computed, 'map computed state')

          insertion_anchor = '''function continueManual() {
            form.selectedImportRateId = ''
            form.manualRate = true
            step.value = 5
          }

          function parseNearestPortResponse(content: string) {'''.replace('          ', '')
          insertion = '''function continueManual() {
            form.selectedImportRateId = ''
            form.manualRate = true
            step.value = 5
          }

          async function reverseGeocodePickup(latitude: number, longitude: number) {
            const response = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`,
              { headers: { Accept: 'application/json', 'Accept-Language': 'es' } },
            )
            if (!response.ok) throw new Error(`Nominatim ${response.status}`)
            const location = await response.json() as { display_name?: string }
            return location.display_name?.trim() || `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`
          }

          async function selectPickupFromMap(point: { latitude: number; longitude: number }) {
            form.pickupLatitude = point.latitude
            form.pickupLongitude = point.longitude
            nearestPortRecommendations.value = []

            try {
              locatingPickup.value = true
              form.pickupAddress = await reverseGeocodePickup(point.latitude, point.longitude)
            } catch {
              form.pickupAddress = `${point.latitude.toFixed(6)}, ${point.longitude.toFixed(6)}`
            } finally {
              locatingPickup.value = false
            }

            if (selectedIncotermCode.value === 'EXW') await recommendNearestPorts()
          }

          function selectWarehouseFromMap(warehouseId: string) {
            if (catalogs.warehouses.some((warehouse) => warehouse.id === warehouseId)) {
              form.warehouseId = warehouseId
            }
          }

          function parseNearestPortResponse(content: string) {'''.replace('          ', '')
          text = replace_once(text, insertion_anchor, insertion, 'map selection functions')

          start = text.index('async function useCurrentLocation() {')
          end = text.index('function selectRecommendedPort', start)
          replacement = '''async function useCurrentLocation() {
            if (!navigator.geolocation) {
              toastStore.warning('Ubicación no disponible', 'El navegador no permite obtener la ubicación actual.')
              return
            }

            try {
              locatingPickup.value = true
              const position = await new Promise<GeolocationPosition>((resolve, reject) =>
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                  enableHighAccuracy: true,
                  timeout: 15000,
                  maximumAge: 30000,
                }),
              )
              await selectPickupFromMap({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
              })
            } catch (error) {
              toastStore.backendError(error, 'No se pudo obtener la ubicación actual.')
            } finally {
              locatingPickup.value = false
            }
          }

          '''.replace('          ', '')
          text = text[:start] + replacement + text[end:]

          old_map_template = '''            <div class="overflow-hidden rounded-[20px] border border-[var(--dh-border)] bg-[var(--dh-card)]">
              <iframe
                title="Mapa interactivo de recolección"
                class="h-72 w-full"
                :src="collectionMapUrl"
                loading="lazy"
              />
            </div>
            <p v-if="pickupCoordinates" class="text-[11px] font-bold text-[var(--dh-text-muted)]">
              Coordenadas: {{ pickupCoordinates.latitude.toFixed(6) }}, {{ pickupCoordinates.longitude.toFixed(6) }}
            </p>'''
          new_map_template = '''            <PricingInteractiveOsmMap
              v-if="selectedIncotermCode === 'EXW'"
              :latitude="form.pickupLatitude"
              :longitude="form.pickupLongitude"
              :interactive-selection="true"
              :initial-zoom="11"
              :selection-zoom="13"
              hint="Arrastre para explorar y toque el mapa para fijar el punto exacto de recolección."
              @select-point="selectPickupFromMap"
            />
            <PricingInteractiveOsmMap
              v-else
              :latitude="form.pickupLatitude"
              :longitude="form.pickupLongitude"
              :markers="warehouseMapMarkers"
              :interactive-selection="false"
              :fit-markers="true"
              :initial-zoom="3"
              :selection-zoom="10"
              hint="Los marcadores corresponden a los WHS globales configurados en Dhole. Toque uno para seleccionarlo."
              @select-marker="selectWarehouseFromMap"
            />
            <p
              v-if="selectedIncotermCode === 'FCA' && warehouseOptions.length > warehouseMapMarkers.length"
              class="text-[11px] font-bold text-amber-600"
            >
              Algunos WHS todavía no tienen coordenadas configuradas; siguen disponibles en la lista y se ubican al seleccionarlos.
            </p>
            <p v-if="pickupCoordinates" class="text-[11px] font-bold text-[var(--dh-text-muted)]">
              Coordenadas: {{ pickupCoordinates.latitude.toFixed(6) }}, {{ pickupCoordinates.longitude.toFixed(6) }}
            </p>'''
          text = replace_once(text, old_map_template, new_map_template, 'interactive map template')

          old_header_css = '''.crystal-lines-header {
            position: sticky;
            top: 0.5rem;
            z-index: 20;
            border: 1px solid var(--dh-border);
            border-radius: 20px;
            padding: 0.8rem;
            background: color-mix(in srgb, var(--dh-card) 94%, transparent);
            box-shadow: var(--dh-shadow-md);
            backdrop-filter: blur(22px);
          }'''.replace('          ', '')
          new_header_css = '''.crystal-lines-header {
            position: sticky;
            top: 6.25rem;
            z-index: 25;
            border: 1px solid var(--dh-border);
            border-radius: 20px;
            padding: 0.8rem;
            background: color-mix(in srgb, var(--dh-card) 97%, transparent);
            box-shadow: var(--dh-shadow-md);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
          }'''.replace('          ', '')
          text = replace_once(text, old_header_css, new_header_css, 'screen 7 sticky header')

          old_mobile_header = '''  .crystal-lines-header {
            top: 0.25rem;
          }
          .crystal-panel {'''.replace('          ', '')
          new_mobile_header = '''  .crystal-lines-header {
            top: 5rem;
            gap: 0.5rem;
            padding: 0.65rem;
          }

          .crystal-lines-header .crystal-kicker,
          .crystal-lines-header .crystal-description {
            display: none;
          }

          .crystal-lines-header .crystal-title {
            margin-top: 0;
            font-size: 1rem;
          }

          .crystal-lines-header .crystal-total-card {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.35rem;
            padding: 0.4rem;
          }

          .crystal-lines-header .crystal-total-card__metric {
            min-width: 0;
            justify-content: space-between;
            border-radius: 12px;
            padding: 0.4rem 0.5rem;
          }

          .crystal-panel {'''.replace('          ', '')
          text = replace_once(text, old_mobile_header, new_mobile_header, 'mobile sticky totals')

          path.write_text(text, encoding='utf-8')

          sidebar_path = Path('src/shared/components/organisms/DhSidebar.vue')
          sidebar = sidebar_path.read_text(encoding='utf-8-sig')
          sidebar = replace_once(
              sidebar,
              'class="rounded-2xl p-2 text-[var(--dh-text-muted)] transition hover:bg-[var(--dh-card-hover)] hover:text-[var(--dh-text)] lg:hidden"',
              'class="inline-flex min-h-11 min-w-11 touch-manipulation items-center justify-center rounded-2xl p-2 text-[var(--dh-text-muted)] transition hover:bg-[var(--dh-card-hover)] hover:text-[var(--dh-text)] lg:hidden"',
              'mobile sidebar close button',
          )
          link_class = 'class="flex items-center rounded-[20px] px-3 py-2.5 text-sm font-black text-[var(--dh-text-soft)] transition hover:bg-[var(--dh-card-hover)]"'
          count = sidebar.count(link_class)
          if count != 2:
              raise SystemExit(f'sidebar links: expected 2 occurrences, found {count}')
          sidebar = sidebar.replace(
              link_class,
              'class="flex min-h-11 touch-manipulation items-center rounded-[20px] px-3 py-2.5 text-sm font-black text-[var(--dh-text-soft)] transition hover:bg-[var(--dh-card-hover)]"',
          )
          sidebar_path.write_text(sidebar, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-interactive-pricing-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): interactive EXW FCA maps and mobile sticky totals"
          git push origin HEAD:master
