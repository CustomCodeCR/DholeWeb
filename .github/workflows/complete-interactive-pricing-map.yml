name: Complete interactive pricing map and mobile UX

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/complete-interactive-pricing-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pricing UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_pricing_interactive_map.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch_pricing_interactive_map.py
          rm -f .github/workflows/complete-interactive-pricing-map.yml
          rm -f .github/workflows/complete-interactive-pricing-map-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): interactive EXW FCA maps and mobile sticky totals"
          git push origin HEAD:master
