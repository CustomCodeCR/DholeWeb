name: Refine variable origin fallback

on:
  push:
    paths:
      - '.github/workflows/refine-variable-origin-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine fallback matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8-sig')
          old = "  if (!visible.has(section) || lines.some((line) => line.section === section)) return\n"
          new = "  const alreadyPresent = section === 'pickup_origin'\n    ? lines.some((line) => line.section === section && line.costDetailType === 'InlandTransport')\n    : lines.some((line) => line.section === section && line.costDetailType === 'OriginCharge')\n  if (!visible.has(section) || alreadyPresent) return\n"
          if old not in text:
              raise SystemExit('fallback condition not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/refine-variable-origin-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): keep variable pickup and origin inputs available"
          git push origin HEAD:master
