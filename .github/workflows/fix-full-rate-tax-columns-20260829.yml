name: Fix full rate tax columns

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-full-rate-tax-columns-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | python

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix(pricing-web): show subtotal IVA and total columns"
          git push origin HEAD:master
