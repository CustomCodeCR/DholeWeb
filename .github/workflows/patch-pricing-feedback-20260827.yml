name: Patch Pricing Feedback 2026-08-27

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-pricing-feedback-20260827.yml'
      - '.github/scripts/patch-pricing-feedback-20260827.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-pricing-feedback-20260827.py

      - name: Build web image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t dhole/web:pricing-feedback-check .

      - name: Commit patch and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-pricing-feedback-20260827.py
          rm -f .github/workflows/patch-pricing-feedback-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(pricing): correct executive VAT sticky header and terms'
          git push origin HEAD:master
