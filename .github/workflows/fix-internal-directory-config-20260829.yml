name: Wire internal directory into Config

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-internal-directory-config-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Config directory route and sidebar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('src/core/router/index.ts')
          text = router.read_text(encoding='utf-8-sig')
          if "name: 'config-employee-directory'" not in text:
              marker = """        {
          path: 'config/catalogs',
          name: 'config-catalogs',
"""
              block = """        {
          path: 'config/employee-directory',
          name: 'config-employee-directory',
          component: () => import('@/modules/settings/views/EmployeeDirectorySettingsView.vue'),
          meta: {
            tabTitle: 'Directorio interno',
            closable: true,
            requiredScope: 'config.catalog-items.view',
          },
        },

"""
              if marker not in text:
                  raise SystemExit('Config catalogs route marker not found')
              text = text.replace(marker, block + marker, 1)
              router.write_text(text, encoding='utf-8')

          layout = Path('src/shared/components/layouts/MainLayout.vue')
          text = layout.read_text(encoding='utf-8-sig')
          old = """const configChildren = computed<SidebarItem[]>(() => {
  const children: SidebarItem[] = []

  if (canView(VIEW_SCOPES.catalogs)) {
    children.push({ label: t('sidebar.catalogs'), path: '/config/catalogs', icon: ListTree })
  }

  return children
})
"""
          new = """const configChildren = computed<SidebarItem[]>(() => {
  const children: SidebarItem[] = []

  if (canView('config.catalog-items.view')) {
    children.push({ label: 'Directorio interno', path: '/config/employee-directory', icon: Users })
  }

  if (canView(VIEW_SCOPES.catalogs)) {
    children.push({ label: t('sidebar.catalogs'), path: '/config/catalogs', icon: ListTree })
  }

  return children
})
"""
          if "path: '/config/employee-directory'" not in text:
              if old not in text:
                  raise SystemExit('Config sidebar marker not found')
              text = text.replace(old, new, 1)
              layout.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-internal-directory-config-20260829.yml
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          git add src/core/router/index.ts src/shared/components/layouts/MainLayout.vue .github/workflows/fix-internal-directory-config-20260829.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix(config): add dedicated internal employee directory"
          git push origin HEAD:master
