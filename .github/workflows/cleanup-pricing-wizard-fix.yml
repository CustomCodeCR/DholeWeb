name: Cleanup pricing wizard fix

on:
  push:
    paths:
      - '.github/workflows/cleanup-pricing-wizard-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup wizard source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  buildOperationalLines,\n', '', 1)
          text = text.replace('  canonicalServiceLine,\n', '', 1)
          start_marker = 'function serviceAmounts(service: CatalogItemSelectDto) {'
          end_marker = 'async function loadApplicableCosts() {'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          text = text.replace('  if (step.value === 6) {\n  await loadApplicableCosts()\n  rebuildRateLines()\n}\n', '  if (step.value === 6) {\n    await loadApplicableCosts()\n    rebuildRateLines()\n  }\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-pricing-wizard-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(pricing): clean Cost context wizard code"
          git push
