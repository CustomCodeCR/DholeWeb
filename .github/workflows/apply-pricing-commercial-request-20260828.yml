name: Apply pricing commercial request changes

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-pricing-commercial-request-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pricing wizard changes
        run: python3 .github/scripts/apply_pricing_commercial_wizard_20260828.py

      - name: Apply commercial status UI changes
        run: python3 .github/scripts/apply_pricing_commercial_status_ui_20260828.py

      - name: Validate production build
        run: docker build --target build -t dhole-web-pricing-commercial-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-pricing-commercial-request-20260828.yml
          rm -f .github/scripts/apply_pricing_commercial_wizard_20260828.py
          rm -f .github/scripts/apply_pricing_commercial_status_ui_20260828.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): implement requested commercial workflow"
          git push origin HEAD:master
