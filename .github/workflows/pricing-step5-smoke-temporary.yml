name: Pricing Step 5 smoke (temporary)
on:
  push:
    branches:
      - feat/pricing-step5-date-comments-20261028
      - feat/pricing-step5-date-comments-develop-20261028
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript and production build
        run: pnpm run build
