name: Apply edit wizard layout

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-edit-wizard-layout-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark edit stages explicitly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/modules/pricing/components/PricingRateFormDrawerLegacy.vue')
          text = path.read_text()
          old = '    <section class="rounded-[28px] border border-[var(--dh-border)] bg-[var(--dh-card)] p-5">'
          if text.count(old) < 4:
              raise SystemExit(f'Expected at least 4 editable stage sections, found {text.count(old)}')
          stage_classes = [
              'pricing-edit-stage pricing-edit-stage--route',
              'pricing-edit-stage pricing-edit-stage--validity',
              'pricing-edit-stage pricing-edit-stage--commercial',
              'pricing-edit-stage pricing-edit-stage--lines',
          ]
          for stage_class in stage_classes:
              replacement = f'    <section class="{stage_class} rounded-[28px] border border-[var(--dh-border)] bg-[var(--dh-card)] p-5">'
              text = text.replace(old, replacement, 1)
          summary_old = '      class="sticky bottom-0 z-20 rounded-[28px] border border-[var(--dh-border-strong)] bg-[var(--dh-shell-strong)] p-4 shadow-[var(--dh-shadow-lg)] backdrop-blur-2xl"'
          summary_new = '      class="pricing-edit-summary rounded-[28px] border border-[var(--dh-border-strong)] bg-[var(--dh-shell-strong)] p-4 shadow-[var(--dh-shadow-lg)]"'
          if summary_old not in text:
              raise SystemExit('Edit summary marker not found')
          text = text.replace(summary_old, summary_new, 1)
          path.write_text(text)
          PY
      - name: Validate build
        shell: bash
        run: docker build --target build -t dhole-web-edit-wizard-stage-validation .
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-edit-wizard-layout-20260828.yml
          git add src/modules/pricing/components/PricingRateFormDrawerLegacy.vue .github/workflows/apply-edit-wizard-layout-20260828.yml
          git commit -m "fix(pricing): mark edit wizard stages and unstick summary"
          git push origin master
