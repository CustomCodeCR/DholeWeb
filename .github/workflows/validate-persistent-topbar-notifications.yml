name: Validate Persistent Topbar Notifications

on:
  push:
    branches: [feature/persistent-topbar-notifications-20260828]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1"
            local value
            value="$(grep -m1 "^${key}=" /opt/dhole/.env | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then value="${value:1:${#value}-2}"; fi
            if [[ "$value" == \'*\' && "$value" == *\' ]]; then value="${value:1:${#value}-2}"; fi
            printf '%s' "$value"
          }
          VITE_API_URL="$(read_env VITE_API_URL)"
          VITE_APP_NAME="$(read_env VITE_APP_NAME)"
          VITE_FRONTEND_DOMAIN="$(read_env VITE_FRONTEND_DOMAIN)"
          : "${VITE_API_URL:?VITE_API_URL required}"
          : "${VITE_APP_NAME:?VITE_APP_NAME required}"
          : "${VITE_FRONTEND_DOMAIN:?VITE_FRONTEND_DOMAIN required}"
          docker build --pull -f Dockerfile \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_APP_NAME="$VITE_APP_NAME" \
            --build-arg VITE_FRONTEND_DOMAIN="$VITE_FRONTEND_DOMAIN" \
            -t dhole/web-persistent-notification-validation .
