name: Pricing Screen 7 smoke temporary
on:
  push:
    branches: [fix/pricing-screen7-fixed-costs-customs-20261028]
  pull_request:
    branches: [master, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Screen 7 targeted tests
        run: node --test tests/pricingStep7FixedCostsAndCustoms.test.ts
      - name: TypeScript and production build
        run: pnpm run build
