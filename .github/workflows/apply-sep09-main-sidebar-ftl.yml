name: Apply Main Sidebar FTL Links

on:
  push:
    branches: [master, develop]
    paths: ['.github/workflows/apply-sep09-main-sidebar-ftl.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch actual main sidebar
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Commit permanent sidebar change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-sep09-main-sidebar-ftl.yml
          git add src/shared/components/layouts/MainLayout.vue
          git commit -m 'fix(web): expose FTL and seller visibility in main sidebar'
          git push origin "HEAD:${GITHUB_REF_NAME}"
