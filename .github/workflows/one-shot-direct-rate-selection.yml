name: Apply direct rate selection flow

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-direct-rate-selection.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make rate selection advance immediately
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue'); s=p.read_text(encoding='utf-8'); old=\"  if (currency) form.currencyId = currency.id\\n}\\n\\nfunction continueManual() {\\n  form.selectedImportRateId = ''\\n  form.manualRate = true\\n}\\n\"; new=\"  if (currency) form.currencyId = currency.id\\n\\n  step.value = 5\\n}\\n\\nfunction continueManual() {\\n  form.selectedImportRateId = ''\\n  form.manualRate = true\\n  step.value = 5\\n}\\n\"; assert old in s, 'selection functions not found'; s=s.replace(old,new,1); old2='<DhButton v-if=\\\"step < 7\\\" :disabled=\\\"!canNext || loadingRates\\\" @click=\\\"next\\\">Continuar <ChevronRight class=\\\"h-4 w-4\\\" /></DhButton>'; new2='<DhButton v-if=\\\"step < 7 && step !== 4\\\" :disabled=\\\"!canNext || loadingRates\\\" @click=\\\"next\\\">Continuar <ChevronRight class=\\\"h-4 w-4\\\" /></DhButton>'; assert old2 in s, 'footer button not found'; p.write_text(s.replace(old2,new2,1), encoding='utf-8')"
      - name: Commit functional change and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-direct-rate-selection.yml
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --check
          git commit -m 'fix(pricing): advance directly from rate selection'
          git push origin master
