name: Deploy Dhole Web
# Editable Hacienda exchange-rate release — 2026-08-28

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-web-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"

      - name: Authenticate GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/customcodecr/dhole-web:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          docker tag "$IMAGE" ghcr.io/customcodecr/dhole-web:latest

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/customcodecr/dhole-web:${GITHUB_SHA}"
          CID="$(docker create "$IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/usr/share/nginx/html" /tmp/dhole-web-bundle
          grep -Rqs "Dhole" /tmp/dhole-web-bundle
          rm -rf /tmp/dhole-web-bundle

      - name: Deploy Web
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/dhole
          docker compose --env-file .env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate dhole-web

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5200/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker ps --filter name=dhole-web
          docker logs --tail 120 dhole-dhole-web-1 || true
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker image prune -f >/dev/null 2>&1 || true
