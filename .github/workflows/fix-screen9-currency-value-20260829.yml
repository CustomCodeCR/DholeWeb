name: Fix Screen 9 Currency Value 20260829

on:
  push:
    branches: [fix/screen9-currency-value-20260829]
    paths:
      - '.github/scripts/fix-screen9-currency-value-20260829.py'
      - '.github/workflows/fix-screen9-currency-value-20260829.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/screen9-currency-value-20260829
          fetch-depth: 0

      - name: Apply currency VALUE fix
        run: python3 .github/scripts/fix-screen9-currency-value-20260829.py

      - name: Verify Screen 9 uses catalog VALUE
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function detailCurrencyValue' src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          grep -q '{{ detailCurrencyValue(detail) }}' src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          grep -q 'formatMoney(Number(detail.costAmount || 0), detailCurrencyValue(detail))' src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          grep -q 'formatMoney(Number(detail.saleAmount || 0), detailCurrencyValue(detail))' src/modules/pricing/components/PricingAlternativeWizardCrystal.vue

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t dhole/web:screen9-currency-value-validation .

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/modules/pricing/components/PricingAlternativeWizardCrystal.vue; then
            echo 'No component changes to commit.'
            exit 0
          fi
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git commit -m 'fix(pricing): display currency catalog value in screen 9'
          git push origin HEAD:fix/screen9-currency-value-20260829

      - name: Cleanup validation image
        if: always()
        run: docker image rm -f dhole/web:screen9-currency-value-validation || true
