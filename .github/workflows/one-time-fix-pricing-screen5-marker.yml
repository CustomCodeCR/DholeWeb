name: One-time fix Pricing screen 5 marker

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/one-time-fix-pricing-screen5-marker.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fix Pricing screen 5 marker
        run: python3 .github/scripts/fix_pricing_screen5_marker.py
      - name: Validate patch
        run: git diff --check
      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-pricing-screen5-marker.yml
          git rm .github/scripts/fix_pricing_screen5_marker.py
          git add build/pricingSellerRateRequestResponsibilities.ts
          git commit -m "fix(pricing): use stable request screen 5 marker"
          git push origin HEAD:develop
