name: One-time fix Pricing handoff anchor

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/one-time-fix-pricing-handoff-anchor.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fix Pricing handoff build anchor
        run: python3 .github/scripts/fix_pricing_handoff_anchor.py
      - name: Validate patch
        run: git diff --check
      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-pricing-handoff-anchor.yml
          git rm .github/scripts/fix_pricing_handoff_anchor.py
          git add build/pricingSellerRateRequestResponsibilities.ts
          git commit -m "fix(pricing): stabilize Pricing request handoff build"
          git push origin HEAD:develop
