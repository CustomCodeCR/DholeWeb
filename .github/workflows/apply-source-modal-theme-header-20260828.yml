name: Apply source modal theme header

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-source-modal-theme-header-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_source_modal_theme_header_20260828.py
      - name: Validate build
        run: docker build --target build -t dhole-web-source-modal-theme-validation .
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-source-modal-theme-header-20260828.yml
          rm -f .github/workflows/fix-source-modal-theme-header-20260828.yml
          rm -f .github/scripts/apply_source_modal_theme_header_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/theme.css src/modules/pricing/components/PricingAlternativeWizardCrystal.vue src/modules/pricing/utils/pricingSourceTrace.ts .github/workflows .github/scripts
          git commit -m 'fix(pricing): enforce modal source and themed solid header'
          git push origin HEAD:master
