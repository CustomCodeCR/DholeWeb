name: Apply rate line cost type fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-rate-line-cost-types.yml'

permissions:
  contents: write

concurrency:
  group: dhole-web-rate-line-fix
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rate line fix
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/deploy-rate-line-fix.sh /tmp/deploy-rate-line-fix.sh
          python3 .github/scripts/apply-rate-line-cost-types.py

      - name: Commit source and cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-rate-line-cost-types.yml \
            .github/scripts/apply-rate-line-cost-types.py \
            .github/scripts/deploy-rate-line-fix.sh
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git commit -m "fix(pricing): respect configured cost detail fields"
          git push origin HEAD:master

      - name: Build and deploy Web
        shell: bash
        run: bash /tmp/deploy-rate-line-fix.sh

# trigger via git ref update
