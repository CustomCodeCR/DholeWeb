name: Apply pricing commercial wizard integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-pricing-commercial-wizard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate commercial rules into wizard
        run: python .github/scripts/apply_pricing_commercial_wizard.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --check
          git commit -m 'feat(pricing): apply incoterm and commercial item rules'
          git push origin master
