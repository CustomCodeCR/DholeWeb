name: Apply Pricing Wizard Fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-pricing-wizard-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply wizard patch
