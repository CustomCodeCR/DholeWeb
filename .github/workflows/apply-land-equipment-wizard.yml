name: Apply Land Equipment Wizard

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-land-equipment-wizard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch terrestrial equipment selection
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_land_equipment_wizard.py
          git diff --check
          git diff -- src/modules/pricing/components/PricingAlternativeWizardCrystal.vue

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --quiet && exit 0
          git commit -m "fix(pricing): use terrestrial equipment for FTL and LTL"
          git push origin HEAD:master
