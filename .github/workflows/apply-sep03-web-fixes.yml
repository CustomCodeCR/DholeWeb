name: Apply Sep 03 Web fixes

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-sep03-web-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Normalize patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-sep03-web-fixes.py')
          text = path.read_text()
          text = text.replace("} from '@/core/services/ownLclConsolidationService' '''", "} from '@/core/services/ownLclConsolidationService'\n'''")
          marker = "wizard = 'src/modules/pricing/components/PricingAlternativeWizardCrystal.vue'\nfor field in ('contacts', 'email', 'phone'):"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('WHS patch-loop start was not found')
          replacement = '''wizard = 'src/modules/pricing/components/PricingAlternativeWizardCrystal.vue'
rep(wizard, '<p v-if="selectedWarehouseContactNames"', "<p v-if=\"shipmentMode !== 'FCL' && selectedWarehouseContactNames\"", 'hide WHS contact names for FCL')
rep(wizard, '<p v-if="selectedWarehouseContactEmails"', "<p v-if=\"shipmentMode !== 'FCL' && selectedWarehouseContactEmails\"", 'hide WHS contact emails for FCL')
rep(wizard, '<p v-if="selectedWarehouseContactPhones"', "<p v-if=\"shipmentMode !== 'FCL' && selectedWarehouseContactPhones\"", 'hide WHS contact phones for FCL')
'''
          text = text[:start] + replacement
          path.write_text(text)
          PY

      - name: Apply Web changes
        run: python3 .github/scripts/apply-sep03-web-fixes.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit Web changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/services/ownLclConsolidationService.ts \
            src/modules/pricing/views/PricingOwnLclView.vue \
            src/modules/pricing/components/PricingAlternativeWizardCrystal.vue \
            build/pricingWizardSep02Requirements.ts
          git commit -m "feat(web): edit own LCL pricing and show FCL agent contacts"
          git push origin HEAD:develop
