name: Complete pricing EXW FCA location workflow

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/complete-pricing-location-ai.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pricing location patch
        shell: bash
        run: python3 .github/scripts/patch_pricing_location.py

      - name: Commit pricing location patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-pricing-location-ai.yml
          rm -f .github/scripts/patch_pricing_location.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): complete EXW FCA map and AI workflow"
          git push origin HEAD:master
