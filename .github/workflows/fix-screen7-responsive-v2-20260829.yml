name: Apply Screen 7 Web Repair v2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-screen7-responsive-v2-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_screen7_web_20260829.py
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Web
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit directly to master
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue src/assets/pricing-metric-colors.css src/core/interfaces/pricing.ts src/modules/pricing/views/PricingRatesView.vue src/modules/pricing/components/PricingEmailSourceModal.vue src/modules/pricing/views/PricingEmailSourceView.vue
          git commit -m 'fix(web): repair screen 7 totals VAT optionals and responsive layout'
          git push origin HEAD:master
