name: Fix pricing preapproved variable origin and browser support

on:
  push:
    paths:
      - '.github/workflows/fix-pricing-preapproved-variable-origin-browser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wizard = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = wizard.read_text(encoding='utf-8-sig')

          text = text.replace(
              '<h2 class="crystal-title">Tarifas aprobadas disponibles</h2>',
              '<h2 class="crystal-title">Tarifas preaprobadas disponibles</h2>',
              1,
          )

          anchor = '''  configuredCosts.forEach((cost) => {
            const section = sectionForCost(cost)
            if (!visible.has(section)) return
            if (cost.costDetailType === 'Freight' && lines.some((line) => line.costDetailType === 'Freight')) return
            if (hasEquivalent(cost.name, cost.costDetailType)) return
            lines.push({
              key: `cost:${cost.id}`,
              section,
              name: cost.name,
              costDetailType: cost.costDetailType,
              costType: cost.costType,
              chargeBasis: cost.chargeBasis ?? defaultChargeBasis(cost.costDetailType),
              costId: cost.id,
              contextLabel: costContextLabel(cost),
              currencyId: cost.currencyId,
              currencyName: cost.currencyName,
              currencyCode: cost.currencyCode,
              costAmount: number(cost.costAmount),
              saleAmount: number(cost.saleAmount),
              included:
                cost.costType !== 'Optional' ||
                (form.dangerousCargo && isDangerousCargoCost(cost)) ||
                (form.overweight && isOverweightCost(cost)),
              optional: cost.costType === 'Optional',
              manual: false,
            })
          })
          '''
          replacement = anchor + '''
          const addVariableSectionFallback = (
            section: RateSection,
            name: string,
            detailType: CostDetailType,
            contextLabel: string,
          ) => {
            if (!visible.has(section) || lines.some((line) => line.section === section)) return
            lines.push({
              key: `variable-section:${section}`,
              section,
              name,
              costDetailType: detailType,
              costType: 'Variable',
              chargeBasis: defaultChargeBasis(detailType),
              contextLabel,
              currencyId: currency.id,
              currencyName: displayValue(currency),
              currencyCode: currency.code,
              costAmount: 0,
              saleAmount: 0,
              included: true,
              optional: false,
              manual: false,
            })
          }

          addVariableSectionFallback(
            'pickup_origin',
            'Recolecta',
            'InlandTransport',
            'Variable: complete costo y venta según la recolección aplicable.',
          )
          addVariableSectionFallback(
            'origin_charges',
            'Cargos en Origen',
            'OriginCharge',
            'Variable: complete costo y venta según los cargos de origen aplicables.',
          )
          '''
          if anchor not in text:
              raise SystemExit('configured costs block not found')
          text = text.replace(anchor, replacement, 1)
          wizard.write_text(text, encoding='utf-8')

          dh_select = Path('src/shared/components/atoms/DhSelect.vue')
          dh_select.write_text('''<script setup lang="ts">
          export interface DhSelectOption { label: string; value: string | number; disabled?: boolean }

          defineProps<{ modelValue: string | number | null; label?: string; placeholder?: string; options: DhSelectOption[]; error?: string; disabled?: boolean }>()
          const emit = defineEmits<{ 'update:modelValue': [value: string | number] }>()
          </script>

          <template>
            <label class="dh-select-wrap block">
              <span v-if="label" class="mb-1.5 block text-xs font-black uppercase tracking-[0.12em] text-[var(--dh-text-muted)]">{{ label }}</span>
              <select
                :value="modelValue ?? ''"
                :disabled="disabled"
                class="dh-select h-11 w-full rounded-[18px] border border-[var(--dh-border)] px-3 text-sm font-semibold shadow-[var(--dh-shadow-sm)] outline-none transition dh-focus-primary disabled:cursor-not-allowed disabled:opacity-50"
                :class="error && 'border-red-500'"
                @change="emit('update:modelValue', ($event.target as HTMLSelectElement).value)"
              >
                <option v-if="placeholder !== ''" value="" disabled>{{ placeholder ?? 'Seleccione una opción' }}</option>
                <option v-for="option in options" :key="option.value" :value="option.value" :disabled="option.disabled">{{ option.label }}</option>
              </select>
              <span v-if="error" class="mt-1 block text-xs font-semibold text-red-500">{{ error }}</span>
            </label>
          </template>

          <style scoped>
          .dh-select-wrap {
            position: relative;
            z-index: 0;
            min-width: 0;
            isolation: isolate;
          }

          .dh-select-wrap:focus-within {
            z-index: 80;
          }

          .dh-select {
            position: relative;
            z-index: 1;
            display: block;
            max-width: 100%;
            background-color: var(--dh-input);
            color: var(--dh-text);
            color-scheme: light;
            -webkit-appearance: menulist;
            appearance: auto;
          }

          .dh-select option,
          .dh-select optgroup {
            background-color: #ffffff;
            color: #030202;
          }

          :global(.dark) .dh-select {
            color-scheme: dark;
          }

          :global(.dark) .dh-select option,
          :global(.dark) .dh-select optgroup {
            background-color: #18181b;
            color: #ffffff;
          }

          @supports (-webkit-touch-callout: none) {
            .dh-select {
              -webkit-appearance: menulist;
              appearance: menulist;
            }
          }
          </style>
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          multi = Path('src/modules/pricing/components/PricingCrystalMultiSelect.vue')
          mtext = multi.read_text(encoding='utf-8-sig')
          mtext = mtext.replace(
              "import { computed, ref } from 'vue'",
              "import { computed, ref } from 'vue'",
              1,
          )
          mtext = mtext.replace(
              "const search = ref('')\n",
              "const search = ref('')\nconst detailsRef = ref<HTMLDetailsElement | null>(null)\n\nfunction handleToggle() {\n  const current = detailsRef.value\n  if (!current?.open) return\n  document.querySelectorAll<HTMLDetailsElement>('details[data-dh-dropdown=\"true\"][open]').forEach((item) => {\n    if (item !== current) item.removeAttribute('open')\n  })\n}\n",
              1,
          )
          mtext = mtext.replace(
              '<details class="crystal-multi group relative">',
              '<details ref="detailsRef" data-dh-dropdown="true" class="crystal-multi group relative" @toggle="handleToggle">',
              1,
          )
          mtext = mtext.replace(
              '''.crystal-multi__trigger {
          ''',
              '''.crystal-multi {
            position: relative;
            z-index: 0;
            min-width: 0;
            isolation: isolate;
          }

          .crystal-multi[open] {
            z-index: 1000;
          }

          .crystal-multi__trigger {
          ''',
              1,
          )
          mtext = mtext.replace(
              '''  background: color-mix(in srgb, var(--dh-shell-strong) 78%, transparent);
            padding: 0.7rem;
          ''',
              '''  background-color: var(--dh-bg-2);
            padding: 0.7rem;
          ''',
              1,
          )
          mtext = mtext.replace('  z-index: 60;\n', '  z-index: 1001;\n', 1)
          mtext = mtext.replace(
              '''  width: 100%;
            min-width: min(360px, 86vw);
          ''',
              '''  inset-inline-start: 0;
            width: 100%;
            min-width: min(360px, 86vw);
            max-width: min(520px, calc(100vw - 2rem));
            overflow: hidden;
          ''',
              1,
          )
          mtext = mtext.replace(
              '''  -webkit-backdrop-filter: blur(32px) saturate(155%);
          }
          ''',
              '''  -webkit-backdrop-filter: blur(32px) saturate(155%);
          }

          :global(.dark) .crystal-multi__menu {
            background-color: #111114;
            color: #ffffff;
          }

          @supports (-webkit-touch-callout: none) {
            .crystal-multi__menu {
              backdrop-filter: none;
              -webkit-backdrop-filter: none;
            }
          }
          ''',
              1,
          )
          multi.write_text(mtext, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-pricing-preapproved-variable-origin-browser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): preapproved rates variable origin and browser dropdowns"
          git push origin HEAD:master
