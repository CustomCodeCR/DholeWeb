name: Apply Pricing Screen 7 Refinements

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/patch-pricing-screen7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Pricing UI patch
        run: python .github/patch_pricing_screen7.py

      - name: Commit refined Pricing flow and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          git rm .github/workflows/patch-pricing-screen7.yml .github/patch_pricing_screen7.py
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue \
                  src/modules/pricing/services/pricingCommercialRules.ts \
                  src/modules/pricing/views/PricingRatesView.vue
          git diff --cached --check
          git commit -m "fix(pricing-web): refine rate creation screen"
          git push origin HEAD:master
