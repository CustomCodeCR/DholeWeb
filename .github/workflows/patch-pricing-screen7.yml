name: Apply Pricing Screen 7 Refinements

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/patch-pricing-screen7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply coherent Pricing UI patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          wizard_path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          wizard = wizard_path.read_text()

          wizard = replace_once(
              wizard,
              "import { computed, onMounted, reactive, ref, watch } from 'vue'\n",
              "import { computed, onMounted, reactive, ref, watch } from 'vue'\nimport { useRouter } from 'vue-router'\n",
              'wizard router import',
          )
          wizard = replace_once(
              wizard,
              "const toastStore = useToastStore()\n",
              "const router = useRouter()\nconst toastStore = useToastStore()\n",
              'wizard router instance',
          )

          old_displayed = """const displayedRateSections = computed(() =>
  visibleSections.value.filter((section) =>
    rateLines.value.some(
      (line) => line.section === section && (!line.optional || line.included),
    ),
  ),
)
"""
          new_displayed = """function standardSectionLines(section: RateSection) {
  return rateLines.value.filter(
    (line) =>
      line.section === section &&
      line.included &&
      !line.optional &&
      !line.manual &&
      line.costDetailType !== 'AgentCharge',
  )
}

const agentLines = computed(() =>
  rateLines.value.filter(
    (line) => line.included && !line.optional && !line.manual && line.costDetailType === 'AgentCharge',
  ),
)

const bottomRateLines = computed(() =>
  rateLines.value.filter((line) => line.included && (line.optional || line.manual)),
)

const displayedRateSections = computed(() =>
  visibleSections.value.filter((section) => standardSectionLines(section).length > 0),
)
"""
          wizard = replace_once(wizard, old_displayed, new_displayed, 'wizard line grouping')

          old_operational = """  if (!configuredCosts.length) {
    buildOperationalLines({
      modality: form.modality as Modality,
      shipmentMode: shipmentModeForApi.value,
      direction: direction.value,
      incotermCode: selectedIncoterm.value?.code ?? '',
      destinationText: displayValue(selectedDestination.value),
    }).forEach((template) => {
      if (!visible.has(template.section)) return
      if (hasEquivalent(template.name, template.costDetailType)) return
      lines.push({
        key: `operational:${normalizeCatalogValue(template.name)}`,
        section: template.section,
        name: template.name,
        costDetailType: template.costDetailType,
        costType: template.costType,
        chargeBasis: defaultChargeBasis(template.costDetailType),
        currencyId: currency.id,
        currencyName: displayValue(currency),
        currencyCode: currency.code,
        costAmount: template.costAmount,
        saleAmount: template.saleAmount,
        included: template.included,
        optional: template.optional,
        manual: false,
      })
    })
  }
"""
          new_operational = """  // Las reglas de Incoterm complementan los costos configurados. Antes este bloque solo
  // corría cuando no existía ningún costo, por lo que EXW/FCA perdían Recolección/Cargos en origen.
  buildOperationalLines({
    modality: form.modality as Modality,
    shipmentMode: shipmentModeForApi.value,
    direction: direction.value,
    incotermCode: selectedIncoterm.value?.code ?? '',
    destinationText: displayValue(selectedDestination.value),
  }).forEach((template) => {
    if (!visible.has(template.section)) return
    if (hasEquivalent(template.name, template.costDetailType)) return
    lines.push({
      key: `operational:${normalizeCatalogValue(template.name)}`,
      section: template.section,
      name: template.name,
      costDetailType: template.costDetailType,
      costType: template.costType,
      chargeBasis: defaultChargeBasis(template.costDetailType),
      currencyId: currency.id,
      currencyName: displayValue(currency),
      currencyCode: currency.code,
      costAmount: template.costAmount,
      saleAmount: template.saleAmount,
      included: template.included,
      optional: template.optional,
      manual: false,
    })
  })
"""
          wizard = replace_once(wizard, old_operational, new_operational, 'wizard operational incoterm lines')

          old_save = """    createdRateId.value = await PricingService.createRate({"""
          new_save = """    const rateId = await PricingService.createRate({"""
          wizard = replace_once(wizard, old_save, new_save, 'wizard create result')

          old_success = """    toastStore.success('Alternativa creada correctamente.')
  } catch (error) {
    toastStore.backendError(error, 'No se pudo crear la alternativa.')
"""
          new_success = """    createdRateId.value = rateId
    toastStore.success('Tarifa creada correctamente.')
    await router.push({ name: 'pricing-rates', query: { rateId } })
  } catch (error) {
    toastStore.backendError(error, 'No se pudo crear la tarifa.')
"""
          wizard = replace_once(wizard, old_success, new_success, 'wizard redirect after create')

          wizard = replace_once(
              wizard,
              '<div v-else class="space-y-6">\n          <div class="flex flex-wrap items-end justify-between gap-4">',
              '<div v-else class="crystal-lines-stage space-y-6">\n          <div class="flex flex-wrap items-end justify-between gap-4">',
              'wizard screen7 stage class',
          )

          old_optional_top = """          <div v-if="optionalChargeOptions.length" class="crystal-soft p-4">
            <PricingCrystalMultiSelect
              v-model="selectedOptionalChargeKeys"
              label="Cargos opcionales"
              placeholder="Seleccione cargos opcionales"
              search-placeholder="Buscar cargo opcional..."
              :options="optionalChargeOptions"
            />
          </div>

"""
          wizard = replace_once(wizard, old_optional_top, '', 'wizard remove optional top')

          old_sections = """          <div v-for="section in displayedRateSections" :key="section" class="space-y-2">
            <h3 class="text-xs font-black uppercase tracking-[0.15em] text-[var(--dh-text-muted)]">{{ sectionLabel(section) }}</h3>
            <div
              v-for="line in rateLines.filter((item) => item.section === section && (!item.optional || item.included))"
              :key="line.key"
              class="crystal-line grid items-end gap-3 p-3 md:grid-cols-[minmax(220px,1fr)_180px_180px_auto]"
            >
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <p class="font-bold">{{ line.name }}</p>
                  <DhBadge v-if="line.optional" variant="neutral">Opcional</DhBadge>
                  <DhBadge v-if="line.costType === 'Variable'" variant="warning">Variable</DhBadge>
                </div>
                <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                  Rubro: {{ detailTypeLabel(line.costDetailType) }} · Moneda: {{ line.currencyName }} · {{ chargeBasisLabel(line.chargeBasis) }}
                </p>
                <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
              </div>
              <DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="!line.included || (!line.manual && line.costType !== 'Optional' && line.costType !== 'Variable')" />
              <DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" :disabled="!line.included" />
              <button v-if="line.manual" type="button" class="h-10 px-2 text-xs font-black text-red-500" @click="rateLines = rateLines.filter((item) => item.key !== line.key)">Eliminar</button>
            </div>
          </div>

          <div class="crystal-soft p-4">
            <p class="mb-3 text-sm font-black">Agregar cargo manual</p>
            <div class="grid gap-3 md:grid-cols-[1fr_220px_auto]">
              <DhInput v-model="form.manualName" label="Nombre del cargo" />
              <DhSelect v-model="form.manualSection" label="Etapa" :options="visibleSections.map((value) => ({ value, label: sectionLabel(value) }))" />
              <DhButton class="md:mt-6" variant="secondary" :disabled="!form.manualName.trim()" @click="addManualCharge"><Plus class="h-4 w-4" /> Añadir cargo</DhButton>
            </div>
          </div>

          <div v-if="createdRateId" class="crystal-success p-4">
            <div class="flex items-center gap-3"><CircleCheck class="h-5 w-5" /><strong>Alternativa creada</strong></div>
            <p class="mt-1 text-xs font-semibold">ID: {{ createdRateId }}</p>
            <DhButton class="mt-3" variant="secondary" @click="resetWizard">Crear otra alternativa</DhButton>
          </div>
"""
          new_sections = """          <div v-for="section in displayedRateSections" :key="section" class="space-y-2">
            <h3 class="text-xs font-black uppercase tracking-[0.15em] text-[var(--dh-text-muted)]">{{ sectionLabel(section) }}</h3>
            <div
              v-for="line in standardSectionLines(section)"
              :key="line.key"
              class="crystal-line grid items-end gap-3 p-3 md:grid-cols-[minmax(220px,1fr)_180px_180px_auto]"
            >
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <p class="font-bold">{{ line.name }}</p>
                  <DhBadge v-if="line.costType === 'Variable'" variant="warning">Variable</DhBadge>
                </div>
                <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                  Rubro: {{ detailTypeLabel(line.costDetailType) }} · Moneda: {{ line.currencyName }} · {{ chargeBasisLabel(line.chargeBasis) }}
                </p>
                <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
              </div>
              <DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="line.costType !== 'Variable'" />
              <DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" />
              <span />
            </div>
          </div>

          <div v-if="agentLines.length" class="space-y-2">
            <h3 class="text-xs font-black uppercase tracking-[0.15em] text-[var(--dh-text-muted)]">Costos de Agente</h3>
            <div
              v-for="line in agentLines"
              :key="line.key"
              class="crystal-line grid items-end gap-3 p-3 md:grid-cols-[minmax(220px,1fr)_180px_180px_auto]"
            >
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <p class="font-bold">{{ line.name }}</p>
                  <DhBadge v-if="line.costType === 'Variable'" variant="warning">Variable</DhBadge>
                </div>
                <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                  Rubro: Costo de agente · Moneda: {{ line.currencyName }} · {{ chargeBasisLabel(line.chargeBasis) }}
                </p>
                <p v-if="line.contextLabel" class="mt-1 text-[11px] font-semibold text-[var(--dh-text-muted)]">{{ line.contextLabel }}</p>
              </div>
              <DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="line.costType !== 'Variable'" />
              <DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" />
              <span />
            </div>
          </div>

          <div class="crystal-bottom-charges space-y-4 p-4">
            <div v-if="optionalChargeOptions.length">
              <PricingCrystalMultiSelect
                v-model="selectedOptionalChargeKeys"
                label="Cargos opcionales"
                placeholder="Seleccione cargos opcionales"
                search-placeholder="Buscar cargo opcional..."
                :options="optionalChargeOptions"
              />
            </div>

            <div v-if="bottomRateLines.length" class="space-y-2">
              <p class="text-xs font-black uppercase tracking-[0.15em] text-[var(--dh-text-muted)]">Opcionales y rubros manuales</p>
              <div
                v-for="line in bottomRateLines"
                :key="line.key"
                class="crystal-line grid items-end gap-3 p-3 md:grid-cols-[minmax(220px,1fr)_180px_180px_auto]"
              >
                <div>
                  <div class="flex flex-wrap items-center gap-2">
                    <p class="font-bold">{{ line.name }}</p>
                    <DhBadge v-if="line.optional" variant="neutral">Opcional</DhBadge>
                    <DhBadge v-if="line.manual" variant="primary">Manual</DhBadge>
                    <DhBadge v-if="line.costType === 'Variable'" variant="warning">Variable</DhBadge>
                  </div>
                  <p class="mt-1 text-xs font-semibold text-[var(--dh-text-muted)]">
                    {{ sectionLabel(line.section) }} · Rubro: {{ detailTypeLabel(line.costDetailType) }} · {{ chargeBasisLabel(line.chargeBasis) }}
                  </p>
                </div>
                <DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" />
                <DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" />
                <button v-if="line.manual" type="button" class="h-10 px-2 text-xs font-black text-red-500" @click="rateLines = rateLines.filter((item) => item.key !== line.key)">Eliminar</button>
                <span v-else />
              </div>
            </div>

            <div>
              <p class="mb-3 text-sm font-black">Agregar rubro manual</p>
              <div class="grid gap-3 md:grid-cols-[1fr_220px_auto]">
                <DhInput v-model="form.manualName" label="Nombre del rubro" />
                <DhSelect v-model="form.manualSection" label="Etapa" :options="visibleSections.map((value) => ({ value, label: sectionLabel(value) }))" />
                <DhButton class="md:mt-6" variant="secondary" :disabled="!form.manualName.trim()" @click="addManualCharge"><Plus class="h-4 w-4" /> Añadir rubro</DhButton>
              </div>
            </div>
          </div>
"""
          wizard = replace_once(wizard, old_sections, new_sections, 'wizard screen7 sections')

          old_footer = """      <DhButton v-else :disabled="saving || !includedLines.length || Boolean(createdRateId)" @click="saveRate"><Check class="h-4 w-4" /> {{ saving ? 'Guardando…' : 'Crear alternativa' }}</DhButton>
"""
          new_footer = """      <DhButton v-else :disabled="saving || !includedLines.length" @click="saveRate"><Check class="h-4 w-4" /> {{ saving ? 'Guardando…' : 'Crear tarifa' }}</DhButton>
"""
          wizard = replace_once(wizard, old_footer, new_footer, 'wizard create label')

          old_glass = """  border: 1px solid color-mix(in srgb, var(--dh-border-strong) 64%, transparent);
  background: color-mix(in srgb, var(--dh-card) 82%, transparent);
  box-shadow: 0 24px 72px rgb(15 23 42 / 0.10), inset 0 1px 0 rgb(255 255 255 / 0.38);
  backdrop-filter: blur(72px) saturate(175%);
  -webkit-backdrop-filter: blur(72px) saturate(175%);
"""
          new_glass = """  border: 1px solid color-mix(in srgb, var(--dh-border-strong) 82%, transparent);
  background: color-mix(in srgb, var(--dh-card) 96%, var(--dh-text) 4%);
  box-shadow: 0 26px 76px rgb(15 23 42 / 0.16), inset 0 1px 0 rgb(255 255 255 / 0.34);
  backdrop-filter: blur(34px) saturate(145%);
  -webkit-backdrop-filter: blur(34px) saturate(145%);
"""
          wizard = replace_once(wizard, old_glass, new_glass, 'wizard stronger glass')

          old_choice = """  border: 1px solid color-mix(in srgb, var(--dh-border) 72%, transparent);
  background: color-mix(in srgb, var(--dh-card) 74%, transparent);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.30);
  backdrop-filter: blur(58px) saturate(170%);
  -webkit-backdrop-filter: blur(58px) saturate(170%);
"""
          new_choice = """  border: 1px solid color-mix(in srgb, var(--dh-border) 84%, transparent);
  background: color-mix(in srgb, var(--dh-card) 94%, var(--dh-text) 6%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.24);
  backdrop-filter: blur(30px) saturate(145%);
  -webkit-backdrop-filter: blur(30px) saturate(145%);
"""
          wizard = replace_once(wizard, old_choice, new_choice, 'wizard stronger choices')

          wizard = replace_once(
              wizard,
              ".crystal-soft {\n  border-radius: 24px;\n  box-shadow: 0 14px 40px rgb(15 23 42 / 0.055), inset 0 1px 0 rgb(255 255 255 / 0.28);\n}\n",
              ".crystal-soft {\n  border-radius: 24px;\n  box-shadow: 0 14px 40px rgb(15 23 42 / 0.09), inset 0 1px 0 rgb(255 255 255 / 0.24);\n}\n\n.crystal-lines-stage {\n  border-radius: 26px;\n  background: color-mix(in srgb, var(--dh-card) 97%, var(--dh-text) 3%);\n  padding: 1rem;\n}\n\n.crystal-bottom-charges {\n  border: 1px solid color-mix(in srgb, var(--dh-border-strong) 82%, transparent);\n  border-radius: 24px;\n  background: color-mix(in srgb, var(--dh-card) 96%, var(--dh-text) 4%);\n  box-shadow: 0 18px 48px rgb(15 23 42 / 0.12);\n}\n",
              'wizard screen7 density styles',
          )

          wizard = replace_once(
              wizard,
              "  background-color: color-mix(in srgb, var(--dh-input) 82%, transparent);\n  backdrop-filter: blur(48px) saturate(165%);\n  -webkit-backdrop-filter: blur(48px) saturate(165%);\n",
              "  background-color: color-mix(in srgb, var(--dh-input) 94%, var(--dh-card) 6%);\n  backdrop-filter: blur(24px) saturate(140%);\n  -webkit-backdrop-filter: blur(24px) saturate(140%);\n",
              'wizard inputs opacity',
          )

          wizard_path.write_text(wizard)

          rules_path = Path('src/modules/pricing/services/pricingCommercialRules.ts')
          rules = rules_path.read_text()
          rules = replace_once(
              rules,
              """  if (context.modality === 'Air' && incoterm === 'FCA')
    add('Cargos en origen de la línea aérea', 'origin_charges', 'OriginCharge')
""",
              """  if (incoterm === 'FCA') {
    add(
      context.modality === 'Air' ? 'Cargos en origen de la línea aérea' : 'Cargos en origen',
      'origin_charges',
      'OriginCharge',
    )
  }
""",
              'rules FCA operational origin',
          )
          rules = replace_once(
              rules,
              """  } else if (incoterm === 'FCA' && modality === 'Air') {
    add(includes, 'Cargos en origen de la línea aérea')
    add(excludes, 'Recolección', 'Embalaje')
""",
              """  } else if (incoterm === 'FCA') {
    add(includes, modality === 'Air' ? 'Cargos en origen de la línea aérea' : 'Cargos en origen')
    add(excludes, 'Recolección')
    if (modality === 'Air') add(excludes, 'Embalaje')
""",
              'rules FCA commercial origin',
          )
          rules_path.write_text(rules)

          rates_path = Path('src/modules/pricing/views/PricingRatesView.vue')
          rates = rates_path.read_text()
          rates = replace_once(
              rates,
              "import { Copy, Edit3, Eye, Plus, ReceiptText, Trash2 } from 'lucide-vue-next'",
              "import { Copy, Edit3, Eye, ReceiptText, Trash2 } from 'lucide-vue-next'",
              'rates remove plus import',
          )
          rates = replace_once(
              rates,
              """function openCreate() {
  drawerStore.open({
    title: 'Crear tarifa manual',
    component: PricingRateFormDrawer,
    size: 'full',
    props: { onSaved: load },
  })
}

""",
              '',
              'rates remove manual create',
          )
          rates = replace_once(
              rates,
              """useViewShortcuts({
  create: () => {
    if (canCreate.value) openCreate()
  },
  save: load,
  refresh: load,
})
onMounted(async () => {
  await catalogs.loadAll()
  await load()
})
""",
              """async function openRequestedRate() {
  const rateId = typeof route.query.rateId === 'string' ? route.query.rateId.trim() : ''
  if (!rateId) return

  try {
    const rate = await PricingService.getRate(rateId)
    openDetail(rate)
  } catch (error) {
    toastStore.backendError(error, 'La tarifa fue creada, pero no se pudo abrir su detalle.')
  }
}

useViewShortcuts({
  save: load,
  refresh: load,
})

watch(
  () => route.query.rateId,
  async (rateId, previousRateId) => {
    if (rateId && rateId !== previousRateId) await openRequestedRate()
  },
)

onMounted(async () => {
  await catalogs.loadAll()
  await load()
  await openRequestedRate()
})
""",
              'rates open created rate',
          )
          rates = replace_once(
              rates,
              """    >
      <template v-if="canCreate" #actions
        ><DhButton label="Crear tarifa manual" :icon="Plus" @click="openCreate"
      /></template>
    </DhPageHeader>
""",
              """    />
""",
              'rates remove header create',
          )
          rates = replace_once(
              rates,
              """        create-label="Crear tarifa"
        :show-create="canCreate"
        @create="openCreate"
""",
              """        :show-create="false"
""",
              'rates remove toolbar create',
          )
          rates_path.write_text(rates)

      - name: Commit refined Pricing flow and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          git rm .github/workflows/patch-pricing-screen7.yml
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue \
                  src/modules/pricing/services/pricingCommercialRules.ts \
                  src/modules/pricing/views/PricingRatesView.vue
          git diff --cached --check
          git commit -m "fix(pricing-web): refine rate creation screen"
          git push origin HEAD:master
