name: Validate Detailed Audit Web

on:
  push:
    branches: [feature/detailed-audit-web-20260828]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production build
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t dhole/web-detailed-audit-validation .
