name: Polish Pricing Line Currency 20260828

on:
  push:
    branches: [feature/pricing-service-currencies-20260828]
    paths:
      - '.github/scripts/polish-pricing-line-currency-20260828.py'
      - '.github/workflows/polish-pricing-line-currency-20260828.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pricing-service-currencies-20260828
          fetch-depth: 0
      - name: Apply currency conversion polish
        run: python3 .github/scripts/polish-pricing-line-currency-20260828.py
      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1"; local value
            value="$(grep -m1 "^${key}=" /opt/dhole/.env | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then value="${value:1:${#value}-2}"; fi
            if [[ "$value" == \'*\' && "$value" == *\' ]]; then value="${value:1:${#value}-2}"; fi
            printf '%s' "$value"
          }
          VITE_API_URL="$(read_env VITE_API_URL)"
          VITE_APP_NAME="$(read_env VITE_APP_NAME)"
          VITE_FRONTEND_DOMAIN="$(read_env VITE_FRONTEND_DOMAIN)"
          : "${VITE_API_URL:?VITE_API_URL required}"
          : "${VITE_APP_NAME:?VITE_APP_NAME required}"
          : "${VITE_FRONTEND_DOMAIN:?VITE_FRONTEND_DOMAIN required}"
          docker build --pull -f Dockerfile \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_APP_NAME="$VITE_APP_NAME" \
            --build-arg VITE_FRONTEND_DOMAIN="$VITE_FRONTEND_DOMAIN" \
            -t dhole/web-pricing-currency-polish-validation .
      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          if ! git diff --cached --quiet; then
            git commit -m 'fix(web): convert amounts when line currency changes'
            git push origin HEAD:feature/pricing-service-currencies-20260828
          fi
