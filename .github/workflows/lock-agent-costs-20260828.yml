name: Lock agent costs in Pricing

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lock-agent-costs-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock agent cost and sale fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="line.costType !== \'Variable\'" />',
                  '<DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="line.costDetailType === \'AgentCharge\' || line.costType !== \'Variable\'" />',
              ),
              (
                  '<DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" />',
                  '<DhInput v-model.number="line.saleAmount" type="number" step="0.01" min="0" label="Venta" :disabled="line.costDetailType === \'AgentCharge\'" />',
              ),
              (
                  '<DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" />',
                  '<DhInput v-model.number="line.costAmount" type="number" step="0.01" min="0" label="Costo" :disabled="line.costDetailType === \'AgentCharge\'" />',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Could not locate expected Pricing input: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: docker build --target build -t dhole-web-agent-cost-lock-validation .

      - name: Commit agent cost lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock-agent-costs-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): lock agent cost and sale fields"
          git push origin HEAD:master
