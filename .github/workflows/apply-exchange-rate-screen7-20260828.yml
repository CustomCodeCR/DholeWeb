name: Apply Hacienda exchange rate on screen 7

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-exchange-rate-screen7-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python .github/scripts/patch_exchange_rate_screen7_20260828.py

      - name: Validate production build
        run: docker build --target build -t dhole-web-exchange-rate-screen7-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-exchange-rate-screen7-20260828.yml
          rm -f .github/scripts/patch_exchange_rate_screen7_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): move editable Hacienda rates to screen 7'
          git push origin master
