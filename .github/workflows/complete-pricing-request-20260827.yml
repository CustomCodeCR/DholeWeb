name: Complete pricing request batch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/complete-pricing-request-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pricing request changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_pricing_request_20260827.py')
          text = path.read_text(encoding='utf-8')
          old = '''text = text.replace("      manual: false,\\n", "      manual: false,\\n      applyVat: false,\\n")
          text = text.replace("    manual: false,\\n", "    manual: false,\\n    applyVat: false,\\n")
          text = text.replace("    manual: true,\\n", "    manual: true,\\n    applyVat: false,\\n")'''.replace('          ', '')
          new = '''lines = text.splitlines(keepends=True)
output = []
for index, line in enumerate(lines):
    output.append(line)
    stripped = line.lstrip()
    if stripped in {"manual: false,\\n", "manual: true,\\n"}:
        indent = line[:len(line) - len(stripped)]
        next_line = lines[index + 1] if index + 1 < len(lines) else ''
        if next_line.strip() != 'applyVat: false,':
            output.append(f"{indent}applyVat: false,\\n")
text = ''.join(output)'''
          if old not in text:
              raise SystemExit('Could not locate unsafe applyVat insertion block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/apply_pricing_request_20260827.py

      - name: Validate build
        run: docker build --target build -t dhole-web-pricing-validation .

      - name: Commit pricing changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-pricing-request-20260827.yml
          rm -f .github/scripts/apply_pricing_request_20260827.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): executive haulage VAT and 500km rules"
          git push origin HEAD:master
