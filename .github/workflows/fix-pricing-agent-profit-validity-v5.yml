name: Commit verified pricing profitability patch

on:
  push:
    paths:
      - '.github/workflows/fix-pricing-agent-profit-validity-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply previously verified patch and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/fix-pricing-agent-profit-validity-v4.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          corepack"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines()) + '\n'
          patch_file = Path('/tmp/dhole-pricing-profitability-patch.py')
          patch_file.write_text(script, encoding='utf-8')
          subprocess.run(['python3', str(patch_file)], check=True)
          PY

          rm -f .github/workflows/fix-pricing-agent-profit-validity.yml
          rm -f .github/workflows/fix-pricing-agent-profit-validity-v2.yml
          rm -f .github/workflows/fix-pricing-agent-profit-validity-v3.yml
          rm -f .github/workflows/fix-pricing-agent-profit-validity-v4.yml
          rm -f .github/workflows/fix-pricing-agent-profit-validity-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pricing): apply agent costs and semantic profitability"
          git push origin HEAD:master
