name: Fix Pricing Screen 7 VAT and additional costs

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-pricing-vat-screen7-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Pricing Web
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d | python3

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          TAG="dhole/web:pricing-vat-check-${GITHUB_RUN_ID}"
          docker build \
            --build-arg VITE_API_URL=https://example.invalid \
            --build-arg VITE_APP_NAME=DholeSystem \
            --build-arg VITE_FRONTEND_DOMAIN=example.invalid \
            -t "$TAG" \
            .
          docker image rm -f "$TAG" >/dev/null 2>&1 || true

      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-pricing-vat-screen7-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing-web): persist VAT state and show added costs"
          git push origin HEAD:master
