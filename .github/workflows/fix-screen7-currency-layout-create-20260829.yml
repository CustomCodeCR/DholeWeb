name: Apply Screen 7 currency layout and create fixes

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Patch Screen 7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8-sig')
          original = text

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              "  currencyCode: string\n  costAmount: number",
              "  currencyCode: string\n  // Moneda real en la que están expresados costAmount/saleAmount. Puede diferir\n  // temporalmente de currencyCode cuando una regla fuerza la divisa visual antes\n  // de que se ejecute la conversión.\n  amountCurrencyCode?: string\n  costAmount: number",
              'RateLine amount currency',
          )

          replace_once(
              "  const previousCode = canonicalCurrencyCode(line)\n  const nextRaw = String(currency.code || displayValue(currency)).trim()",
              "  // Para costos configurados la fuente monetaria es la moneda del maestro, no\n  // necesariamente la etiqueta que ya tenga la línea. Esto evita el caso USD 15 ->\n  // mostrar CRC 15 cuando una regla de servicio cambió primero la divisa.\n  const configuredCost = line.costId ? costs.value.find((cost) => cost.id === line.costId) : null\n  const previousRaw = String(\n    line.amountCurrencyCode ||\n      configuredCost?.currencyCode ||\n      configuredCost?.currencyName ||\n      canonicalCurrencyCode(line),\n  ).trim()\n  const previousNormalized = normalizeCatalogValue(previousRaw)\n  const previousCode =\n    previousRaw.toUpperCase() === 'CRC' || previousNormalized.includes('colon') ? 'CRC' : 'USD'\n  const nextRaw = String(currency.code || displayValue(currency)).trim()",
              'setLineCurrency source currency',
          )

          replace_once(
              "  line.currencyId = currency.id\n  line.currencyName = displayValue(currency) || currency.label || currency.code\n  line.currencyCode = nextCode",
              "  line.currencyId = currency.id\n  line.currencyName = displayValue(currency) || currency.label || currency.code\n  line.currencyCode = nextCode\n  line.amountCurrencyCode = nextCode",
              'setLineCurrency amount snapshot',
          )

          # Existing persisted details already have amounts expressed in detail.currencyCode.
          hydration_anchor = "        currencyCode: detail.currencyCode,\n        costAmount: Number(detail.costAmount || 0),"
          if hydration_anchor in text:
              text = text.replace(
                  hydration_anchor,
                  "        currencyCode: detail.currencyCode,\n        amountCurrencyCode: detail.currencyCode,\n        costAmount: Number(detail.costAmount || 0),",
                  1,
              )
          elif "amountCurrencyCode: detail.currencyCode" not in text:
              raise SystemExit('hydrate amount currency: anchor not found')

          # El usuario pidió eliminar por completo la leyenda del IVA en Pantalla 7.
          text, removed = re.subn(
              r'\n\s*<p class="text-\[10px\] font-bold leading-snug text-\[var\(--dh-text-muted\)\]">\s*\n\s*Importe del IVA se refleja en pantalla 8\s*\n\s*</p>',
              '',
              text,
          )
          if 'Importe del IVA se refleja en pantalla 8' in text:
              raise SystemExit('IVA helper text still present')
          if removed == 0 and original == text:
              raise SystemExit('IVA helper text: nothing removed')

          replace_once(
              "  .crystal-line--freight {\n    grid-template-columns: minmax(260px, 500px) 120px 140px 140px !important;\n    justify-content: start;\n    max-width: 1040px;\n  }",
              "  .crystal-line--freight {\n    width: 100%;\n    max-width: none;\n    grid-template-columns: minmax(320px, 1fr) 120px 140px 140px !important;\n    justify-content: stretch;\n  }",
              'freight full width',
          )

          replace_once(
              "    await PricingService.setRateStatus(rateId, { status: 'Open' })\n    const created = await PricingService.getRate(rateId)",
              "    // CreateRate puede devolver la solicitud ya Open cuando el usuario tiene\n    // permiso de aprobación. No enviamos Open -> Open porque esa transición era la\n    // causa del RateInvalidStatus al crear.\n    let created = await PricingService.getRate(rateId)\n    if (created.status !== 'Open') {\n      await PricingService.setRateStatus(rateId, { status: 'Open' })\n      created = await PricingService.getRate(rateId)\n    }",
              'idempotent open request',
          )

          if text == original:
              raise SystemExit('No source changes produced')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git commit -m 'fix(web): convert line currencies and repair Screen 7 layout creation'
          git push origin HEAD:master
