name: Fix international cargo port copy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-international-cargo-port-copy-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update EXW maritime copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "title: 'Puertos marítimos más cercanos a la recolección',": "title: 'Puertos marítimos de carga internacional más cercanos',",
              "description: 'La IA busca exclusivamente puertos marítimos reales dentro de 500 km desde el pin EXW. El catálogo de orígenes solo se usa para ofrecer cambio rápido cuando existe una coincidencia.',": "description: 'La IA busca exclusivamente puertos marítimos comerciales que operen carga internacional dentro de 500 km desde el pin EXW: contenedores, carga general, graneles, RoRo de carga o terminales tanker. No muestra marinas, pesca, ferris o terminales solo de pasajeros, cruceros ni muelles locales.',",
              "action: 'Buscar puertos marítimos cercanos',": "action: 'Buscar puertos de carga cercanos',",
              "badge: 'Puerto marítimo cercano',": "badge: 'Puerto de carga internacional',",
              "defaultReason: 'Puerto marítimo recomendado por cercanía y viabilidad logística desde la recolección.',": "defaultReason: 'Puerto marítimo de carga internacional recomendado por cercanía y viabilidad logística desde la recolección.',",
              "emptyTitle: 'Sin puertos marítimos encontrados',": "emptyTitle: 'Sin puertos de carga internacional encontrados',",
              "emptyDescription: 'La búsqueda geográfica no encontró un puerto marítimo verificable dentro de 500 km del punto marcado.',": "emptyDescription: 'La búsqueda no encontró un puerto marítimo de carga internacional verificable dentro de 500 km del punto marcado.',",
              "unavailableDescription: 'No fue posible consultar los puertos marítimos cercanos en este momento. Inténtelo nuevamente.',": "unavailableDescription: 'No fue posible consultar los puertos marítimos de carga internacional cercanos en este momento. Inténtelo nuevamente.',",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'copy anchor not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('International cargo port copy updated.')
          PY

      - name: Commit code and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-international-cargo-port-copy-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web): clarify international cargo port search'
          git push origin HEAD:master
