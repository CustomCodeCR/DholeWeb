# One-shot patch workflow; it removes itself after applying the validated change.
name: Patch EXW nearest ports and mobile VAT

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-exw-nearest-ports-mobile-vat-20260827.yml'
      - '.github/scripts/patch-exw-nearest-ports-mobile-vat-20260827.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-exw-nearest-ports-mobile-vat-20260827.py

      - name: Build web image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t dhole/web:exw-mobile-vat-check .

      - name: Commit patch and cleanup helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-exw-nearest-ports-mobile-vat-20260827.py
          rm -f .github/workflows/patch-exw-nearest-ports-mobile-vat-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(pricing): EXW nearest ports and mobile VAT layout'
          git push origin HEAD:master
