name: Fix FCL WHS shipment mode bindings

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-fcl-contact-computed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fix shipment mode bindings
        run: |
          set -euo pipefail
          FILE='src/modules/pricing/components/PricingAlternativeWizardCrystal.vue'
          before="$(grep -c \"shipmentMode !== 'FCL' && selectedWarehouseContact\" "$FILE" || true)"
          test "$before" -eq 3
          sed -i "s/shipmentMode !== 'FCL' && selectedWarehouseContact/form.shipmentMode !== 'FCL' \&\& selectedWarehouseContact/g" "$FILE"
          after="$(grep -c \"form.shipmentMode !== 'FCL' && selectedWarehouseContact\" "$FILE" || true)"
          test "$after" -eq 3
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git commit -m "fix(web): use form shipment mode for FCL WHS contacts"
          git push origin HEAD:develop
