name: Fix FCL contact computed closure

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-fcl-contact-computed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fix computed closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/pricingWizardSep02Requirements.ts')
          text = path.read_text()
          old = """    .sort((left, right) => Number(right.isPrimary === true) - Number(left.isPrimary === true))
}`,
    'FCL agent contact directory',
"""
          new = """    .sort((left, right) => Number(right.isPrimary === true) - Number(left.isPrimary === true))
})`,
    'FCL agent contact directory',
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one FCL computed closure, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/pricingWizardSep02Requirements.ts
          git commit -m "fix(web): close FCL agent contact computed"
          git push origin HEAD:develop
