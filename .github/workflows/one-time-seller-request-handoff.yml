name: One-time seller request screen handoff

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/one-time-seller-request-handoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Move seller/Pricing handoff after Pantalla 4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('build/pricingSellerRateRequests.ts')
          code = path.read_text()

          replacements = [
              ("return titles.slice(0, 3)", "return titles.slice(0, 4)"),
              ("Ventas completa únicamente las pantallas 0 a 3. Pricing recibe la solicitud y continúa desde la pantalla 4.", "Ventas completa únicamente las pantallas 0 a 4. Pricing recibe la solicitud y continúa desde la pantalla 5."),
              ("Solicitud creada por Ventas. Continúe desde la pantalla 4 hasta completar y enviar la tarifa.", "Solicitud creada por Ventas. Pricing continúa desde la pantalla 5 hasta completar y enviar la tarifa."),
              ("Complete las pantallas 0 a 3 antes de enviar la solicitud a Pricing.", "Complete las pantallas 0 a 4 antes de enviar la solicitud a Pricing."),
              ("rateRequestPriority.value = request.priority\\n    step.value = 4", "rateRequestPriority.value = request.priority\\n    step.value = 5\\n    await searchApprovedRates()"),
              ("`  if (props.rateId || props.rateRequestId || target <= step.value) step.value = target`", "`  if (props.rateId || (props.rateRequestId ? target >= 5 : target <= step.value)) step.value = target`"),
              ("sellerRequestMode && step === 3", "sellerRequestMode && step === 4"),
          ]

          for old, new in replacements:
              count = code.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              code = code.replace(old, new)

          anchor = """  code = replaceOne(\n    code,\n    `  if (props.rateId || target <= step.value) step.value = target`,\n    `  if (props.rateId || (props.rateRequestId ? target >= 5 : target <= step.value)) step.value = target`,\n    'request step navigation',\n  )\n"""
          addition = anchor + """\n  code = replaceOne(\n    code,\n    `function previous() {\\n  if (step.value > 1) step.value -= 1\\n}`,\n    `function previous() {\\n  const minimumStep = props.rateRequestId ? 5 : 1\\n  if (step.value > minimumStep) step.value -= 1\\n}`,\n    'request previous step floor',\n  )\n\n  code = replaceOne(\n    code,\n    `<DhButton variant=\\"secondary\\" :disabled=\\"step === 1 || saving\\" @click=\\"previous\\"><ChevronLeft class=\\"h-4 w-4\\" /> Atrás</DhButton>`,\n    `<DhButton variant=\\"secondary\\" :disabled=\\"(rateRequestId ? step <= 5 : step === 1) || saving\\" @click=\\"previous\\"><ChevronLeft class=\\"h-4 w-4\\" /> Atrás</DhButton>`,\n    'request back button floor',\n  )\n"""
          if code.count(anchor) != 1:
              raise SystemExit('Could not insert Pricing minimum-step guards')
          code = code.replace(anchor, addition)

          path.write_text(code)
          PY
      - name: Validate web build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit functional change and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-seller-request-handoff.yml
          git add build/pricingSellerRateRequests.ts
          git commit -m "feat(pricing): split seller request at screen 4"
          git push origin HEAD:develop
