name: Fix pricing open request status

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-open-request-web-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch open request status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          s = p.read_text(encoding='utf-8')
          old = "await PricingService.setRateStatus(rateId, { status: 'RequestedByClient' })"
          new = "await PricingService.setRateStatus(rateId, { status: 'Open' })"
          if old not in s:
              raise SystemExit('open request status anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-open-request-web-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing-web): save missing-rate requests as open"
          git push origin HEAD:master
