name: Dhole Web CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # Develop has no SEO/marketing scripts or public origin test files.
      # Existing agent, Pricing, CRM, locale and build validations run below.
      - name: Agent module tests
        run: pnpm run test:agent
      - name: Pricing rate update regression tests
        run: pnpm run test:pricing-rate-update
      - name: CRM and SRM navigation/integration tests
        run: pnpm run test:crm
      - name: Workspace tabs and service-version regression tests
        run: pnpm run test:workspace-tabs
      - name: Mobile layout and locale compliance
        run: pnpm run test:mobile-i18n
      - name: Email inbox translation and mobile settings regression
        run: pnpm run test:email-mobile-i18n
      - name: Type-check and build
        run: pnpm run build
      - name: Mount transformed Pricing wizard in SSR (blocks blank pages)
        run: node --test tests/pricingWizardSsrSetup.test.mjs
      - name: Inspect production Pricing bundle symbol W (TDZ root cause)
        run: node scripts/diagnose-pricing-bundle.mjs
      - name: Mount Pricing wizard in headless Chrome (detect TDZ)
        run: node scripts/test-pricing-browser-smoke.mjs
      - name: Verify IDTRA action survived production bundle compilation
        run: node --test tests/pricingIdtraBundle.test.mjs
