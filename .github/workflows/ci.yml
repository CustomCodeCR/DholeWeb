name: Dhole Web CI

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: SEO tests
        run: npm run test:seo
      - name: Type-check and build
        run: npm run build
