name: Dhole Web CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # master does not contain SEO/Marketing modules or their test scripts.
      # develop continues running their complete suites.
      - name: Public origin coloader contact tests
        run: node --test tests/publicOriginContactPolicy.test.ts tests/publicOriginDirectory.test.ts
      - name: Agent module tests
        run: pnpm run test:agent
      # Build before older unrelated Pricing regressions so CI always verifies this UI.
      - name: Workspace tabs and service-version regression tests
        run: pnpm run test:workspace-tabs
      - name: Mobile layout and locale compliance
        run: pnpm run test:mobile-i18n
      - name: Email inbox translation and mobile settings regression
        run: pnpm run test:email-mobile-i18n
      - name: Type-check and build
        run: pnpm run build
      - name: Verify IDTRA action survived production bundle compilation
        run: node --test tests/pricingIdtraBundle.test.mjs
      - name: Pricing rate update regression tests
        run: pnpm run test:pricing-rate-update
      - name: CRM and SRM navigation/integration tests
        run: pnpm run test:crm
