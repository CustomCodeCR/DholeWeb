name: Dhole Web CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # master does not contain SEO/Marketing modules or their test scripts.
      # develop continues running their complete suites.
      - name: Agent module tests
        run: pnpm run test:agent
      - name: Type-check and build
        run: pnpm run build
