name: Fix official summary template syntax

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-official-summary-template-syntax-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Vue template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/pricing/views/PricingRatesView.vue')
          text = path.read_text(encoding='utf-8-sig')
          old = '#cell-commercial="{.row }"'
          if old not in text:
              raise SystemExit('invalid cell-commercial slot marker not found')
          text = text.replace(old, '#cell-commercial="{ row }"', 1)
          text = text.replace('Costo \u00f7 Venta \u00f7 Margen', 'Costo / Venta / Margen', 1)
          text = text.replace(' \u00f7 {{ formatMoney', ' / {{ formatMoney')
          path.write_text(text, encoding='utf-8')
          PY
          grep -F '#cell-commercial="{ row }"' src/modules/pricing/views/PricingRatesView.vue
          grep -F 'Costo / Venta / Margen' src/modules/pricing/views/PricingRatesView.vue
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-official-summary-template-syntax-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing-web): correct official summary template syntax"
          git push origin HEAD:master
