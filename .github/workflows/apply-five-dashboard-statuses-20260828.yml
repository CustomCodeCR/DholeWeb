name: Apply five dashboard statuses
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-five-dashboard-statuses-20260828.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_five_dashboard_statuses_20260828.py
      - name: Validate build
        run: docker build --target build -t dhole-web-five-dashboard-statuses-validation .
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-five-dashboard-statuses-20260828.yml
          rm -f .github/scripts/apply_five_dashboard_statuses_20260828.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/dashboard/components/PricingRoleDashboard.vue .github/workflows .github/scripts
          git commit -m 'fix(pricing): show five commercial states on dashboard'
          git push origin HEAD:master
