name: Fix pricing lines VAT and sticky header

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-pricing-lines-vat-and-sticky-header-20260828.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - linux
      - x64
      - dhole
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pricing fixes
        run: python3 .github/scripts/fix_pricing_lines_vat_sticky_20260828.py

      - name: Validate diff
        run: git diff --check

      - name: Validate production build
        run: docker build --target build -t dhole-web-line-vat-sticky-validation .

      - name: Commit functional changes
        run: |
          rm -f .github/workflows/fix-pricing-lines-vat-and-sticky-header-20260828.yml
          rm -f .github/scripts/fix_pricing_lines_vat_sticky_20260828.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): make VAT per line and sticky header solid"
          git push origin HEAD:master
