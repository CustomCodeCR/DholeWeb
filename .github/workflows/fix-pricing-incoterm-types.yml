name: Apply incoterm section typing fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-pricing-incoterm-types.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Incoterm section typing
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue'); s=p.read_text(); old=\"  const configured = metadata(selectedIncoterm.value)?.rateSections ?? ['international_freight']\"; new=\"  const configured = (metadata(selectedIncoterm.value)?.rateSections ?? ['international_freight']) as RateSection[]\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --check
          git commit -m 'fix(pricing): type incoterm section fallback'
          git push origin master
