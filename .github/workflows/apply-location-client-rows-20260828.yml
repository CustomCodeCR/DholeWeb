name: Apply requested pricing location and client rows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-location-client-rows-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes
        run: python3 .github/scripts/apply_location_client_rows_20260828.py

      - name: Validate web build
        run: docker build --target build -t dhole-web-location-client-validation .

      - name: Commit requested changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-location-client-rows-20260828.yml
          rm -f .github/scripts/apply_location_client_rows_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(pricing): searchable CY SD route fields and editable executive'
          git push origin HEAD:master
