name: Restore pricing canonical helper

on:
  push:
    paths:
      - '.github/workflows/restore-pricing-canonical-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore required import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8')
          marker = '  calculateCargoInsurance,\n'
          if '  canonicalServiceLine,\n' not in text:
              assert marker in text
              text = text.replace(marker, marker + '  canonicalServiceLine,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/restore-pricing-canonical-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pricing): restore commercial service helper import"
          git push
