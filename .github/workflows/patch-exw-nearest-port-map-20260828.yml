name: Patch EXW nearest-port map

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-exw-nearest-port-map-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show nearest ports on EXW map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          text = path.read_text(encoding='utf-8')

          declaration_anchor = "const nearestPortRecommendations = ref<NearestPortRecommendation[]>([])\nconst destinationVatEnabled = ref(false)"
          declaration_replacement = """const nearestPortRecommendations = ref<NearestPortRecommendation[]>([])
          const nearestPortMapMarkers = computed(() => nearestPortRecommendations.value.flatMap((recommendation) => {
            if (recommendation.latitude == null || recommendation.longitude == null) return []
            if (!Number.isFinite(recommendation.latitude) || !Number.isFinite(recommendation.longitude)) return []
            const distanceLabel = recommendation.distanceKm == null ? '' : ` · ${recommendation.distanceKm.toFixed(1)} km`
            return [{
              id: `nearest-port:${recommendation.key}`,
              label: `${recommendation.name}${distanceLabel}`,
              latitude: recommendation.latitude,
              longitude: recommendation.longitude,
              selected: false,
            }]
          }))
          const destinationVatEnabled = ref(false)"""
          declaration_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in declaration_replacement.splitlines())

          if declaration_anchor not in text:
              raise SystemExit('Could not locate nearestPortRecommendations declaration anchor')
          text = text.replace(declaration_anchor, declaration_replacement, 1)

          map_anchor = '\n'.join([
              '            <PricingInteractiveOsmMap',
              "              v-if=\"selectedIncotermCode === 'EXW'\"",
              '              :latitude="form.pickupLatitude"',
              '              :longitude="form.pickupLongitude"',
              '              :interactive-selection="true"',
              '              :initial-zoom="11"',
              '              :selection-zoom="13"',
              '              hint="Arrastre para explorar y toque el mapa para fijar el punto exacto de recolección."',
              '              @select-point="selectPickupFromMap"',
              '            />',
          ])
          map_replacement = '\n'.join([
              '            <PricingInteractiveOsmMap',
              "              v-if=\"selectedIncotermCode === 'EXW'\"",
              '              :latitude="form.pickupLatitude"',
              '              :longitude="form.pickupLongitude"',
              '              :markers="nearestPortMapMarkers"',
              '              :fit-markers="nearestPortMapMarkers.length > 0"',
              '              :interactive-selection="true"',
              '              :initial-zoom="11"',
              '              :selection-zoom="13"',
              '              hint="Arrastre para explorar y toque el mapa para fijar el punto exacto de recolección. Los puertos encontrados se muestran como marcadores."',
              '              @select-point="selectPickupFromMap"',
              '            />',
          ])

          if map_anchor not in text:
              raise SystemExit('Could not locate EXW PricingInteractiveOsmMap anchor')
          text = text.replace(map_anchor, map_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: docker build --target build -t dhole-web-exw-map-validation .

      - name: Commit map fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-exw-nearest-port-map-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): plot EXW nearest ports on map"
          git push origin HEAD:master
