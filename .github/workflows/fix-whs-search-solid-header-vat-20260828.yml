name: Apply WHS search and VAT rules

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-whs-search-solid-header-vat-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested Pricing UI corrections
        run: python3 .github/scripts/fix_whs_search_solid_header_vat_20260828.py

      - name: Validate production build
        run: docker build --target build -t dhole-web-whs-vat-validation .

      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-whs-search-solid-header-vat-20260828.yml
          rm -f .github/scripts/fix_whs_search_solid_header_vat_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): improve WHS picker and destination VAT rules'
          git push origin HEAD:master
