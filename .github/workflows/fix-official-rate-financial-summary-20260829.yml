name: Fix official rate financial summary

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-official-rate-financial-summary-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | python
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-official-rate-financial-summary-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing-web): show cost sale and margin totals"
          git push origin HEAD:master
