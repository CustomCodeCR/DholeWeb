name: Fix internal directory catalog binding

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind Settings directory to Config catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/settings/views/EmployeeDirectorySettingsView.vue')
          s = p.read_text()
          s = s.replace("const DIRECTORY_GROUP_ID = 'c2900000-0000-4000-8000-000000000001'", "const DIRECTORY_GROUP_ID = 'c2920000-0000-4000-8000-000000000001'")
          s = s.replace("const DIRECTORY_GROUP_SLUG = 'employee-directory'", "const DIRECTORY_GROUP_SLUG = 'internal-directory'")
          p.write_text(s)
          PY
          grep -q "DIRECTORY_GROUP_SLUG = 'internal-directory'" src/modules/settings/views/EmployeeDirectorySettingsView.vue
          grep -q "DIRECTORY_GROUP_ID = 'c2920000-0000-4000-8000-000000000001'" src/modules/settings/views/EmployeeDirectorySettingsView.vue
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/settings/views/EmployeeDirectorySettingsView.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(settings): use real internal directory catalog"
          git push origin master
