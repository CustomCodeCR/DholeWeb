name: Apply pricing wizard cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-pricing-wizard-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply focused pricing patch
        run: python .github/scripts/apply-rate-line-cost-types.py
      - name: Validate patch
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git commit -m "fix(pricing): align wizard with pricing costs and FTL LTL"
          git push origin HEAD:master
