name: Validate Wizard View Screen 9 20260829

on:
  push:
    branches: [feature/wizard-view-screen9-commercial-actions-20260829]
    paths:
      - '.github/scripts/apply-wizard-view-screen9-20260829.py'
      - '.github/workflows/validate-wizard-view-screen9-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wizard-view-screen9-commercial-actions-20260829
          fetch-depth: 0

      - name: Apply implementation
        run: python3 .github/scripts/apply-wizard-view-screen9-20260829.py

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1" value
            value="$(grep -m1 "^${key}=" /opt/dhole/.env | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then value="${value:1:${#value}-2}"; fi
            if [[ "$value" == \'*\' && "$value" == *\' ]]; then value="${value:1:${#value}-2}"; fi
            printf '%s' "$value"
          }
          VITE_API_URL="$(read_env VITE_API_URL)"
          VITE_APP_NAME="$(read_env VITE_APP_NAME)"
          VITE_FRONTEND_DOMAIN="$(read_env VITE_FRONTEND_DOMAIN)"
          : "${VITE_API_URL:?VITE_API_URL required}"
          : "${VITE_APP_NAME:?VITE_APP_NAME required}"
          : "${VITE_FRONTEND_DOMAIN:?VITE_FRONTEND_DOMAIN required}"
          docker build --pull -f Dockerfile \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_APP_NAME="$VITE_APP_NAME" \
            --build-arg VITE_FRONTEND_DOMAIN="$VITE_FRONTEND_DOMAIN" \
            -t dhole/web-wizard-view-screen9-validation .

      - name: Commit functional implementation
        run: |
          set -euo pipefail
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'feat(web): add full rate view and commercial actions'
          git push origin HEAD:feature/wizard-view-screen9-commercial-actions-20260829
