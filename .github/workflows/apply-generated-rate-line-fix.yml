name: Apply Generated Rate Line Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-generated-rate-line-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix generated rate cost types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/pricing/components/PricingAlternativeWizardCrystal.vue')
          source = path.read_text(encoding='utf-8')

          freight_old = """      name: 'Flete Internacional',
      costDetailType: 'Freight',
      costType: 'Fixed',
      currencyId: currency.id,"""
          freight_new = """      name: 'Flete Internacional',
      costDetailType: 'Freight',
      costType: 'Variable',
      currencyId: currency.id,"""

          service_old = """        costDetailType: detailType,
        costType: optional ? 'Optional' : 'Fixed',
        currencyId: currency.id,"""
          service_new = """        costDetailType: detailType,
        costType: optional ? 'Optional' : 'Variable',
        currencyId: currency.id,"""

          if source.count(freight_old) != 1:
              raise SystemExit(f'Expected one freight pattern, found {source.count(freight_old)}')
          if source.count(service_old) != 1:
              raise SystemExit(f'Expected one service pattern, found {source.count(service_old)}')

          source = source.replace(freight_old, freight_new, 1)
          source = source.replace(service_old, service_new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pricing/components/PricingAlternativeWizardCrystal.vue
          git diff --cached --check
          git commit -m 'fix(pricing): keep fixed type for master costs only'
          git push origin master
